      HKG: '香港', YVR: '溫哥華', YYZ: '多倫多', YYC: '卡加利', YUL: '滿地可',
      LHR: '倫敦', NRT: '東京成田', HND: '東京羽田', KIX: '大阪關西',
      TPE: '台北桃園', ICN: '首爾仁川', SIN: '新加坡', BKK: '曼谷',
      SYD: '悉尼', MEL: '墨爾本', LAX: '洛杉磯', SFO: '三藩市',
      SEA: '西雅圖', JFK: '紐約甘迺迪', EWR: '紐約紐華克', ORD: '芝加哥',
      DFW: '達拉斯', IAH: '侯斯頓', BOS: '波士頓', DEN: '丹佛',
      LAS: '拉斯維加斯', PHX: '鳳凰城', DXB: '杜拜', PVG: '上海浦東', PEK: '北京首都'
    };

    function parseAirLabsTimeToEpochMs(tsNum, utcStr) {
      if (typeof tsNum === 'number' && tsNum > 1000000000) return tsNum * 1000;
      if (utcStr) {
        const iso = String(utcStr).trim().replace(' ', 'T') + (String(utcStr).includes('Z') ? '' : 'Z');
        const ms = Date.parse(iso);
        if (!isNaN(ms)) return ms;
      }
      return 0;
    }

    function formatMinsRemain(mins) {
      const m = Math.max(0, Math.round(mins));
      const h = Math.floor(m / 60);
      const r = m % 60;
      if (h > 0) return `剩餘 ${h}h ${r}m`;
      return `剩餘 ${r}m`;
    }

    /* Local Clock Progress Engine: Smoothly advances flight progress 0% -> 100% between depTs & arrTs without spending extra API quota */
    function recalcFlightProgressFromClock(shouldRender = false) {
      if (!state.flights || !state.flights.length) return;
      const fl = state.flights[0];
      if (!fl.depTs || !fl.arrTs || fl.arrTs <= fl.depTs) return;
      if (fl.flightStatus === 'cancelled') return;

      const nowMs = Date.now();
      if (nowMs >= fl.arrTs || fl.flightStatus === 'landed') {
        if (fl.progress !== 100) {
          fl.progress = 100;
          fl.remainText = '已抵達 100%';
          if (!fl.isDelayed) fl.statusText = '已降落 · 準時';
          saveState();
          if (shouldRender) renderBoard();
        }
        return;
      }

      if (nowMs <= fl.depTs) {
        const minsToDep = Math.round((fl.depTs - nowMs) / 60000);
        fl.progress = 12;
        fl.remainText = minsToDep > 0 ? `${minsToDep}m 後起飛` : '準備起飛';
        if (shouldRender) renderBoard();
        return;
      }

      const ratio = (nowMs - fl.depTs) / (fl.arrTs - fl.depTs);
      const pct = Math.min(99, Math.max(12, Math.round(ratio * 100)));
      const remMins = (fl.arrTs - nowMs) / 60000;
      fl.progress = pct;
      fl.remainText = formatMinsRemain(remMins);
      if (!fl.isDelayed) fl.statusText = '飛行中 · 準時';
      saveState();
      if (shouldRender) renderBoard();
    }

    async function fetchFlightLive(manual = false) {
      if (!state.flights.length) state.flights.push(JSON.parse(JSON.stringify(DEFAULT_STATE.flights[0])));
      const fl = state.flights[0];
      const targetCode = String(fl.code || 'CX888').trim().toUpperCase().replace(/\s+/g, '');
      const prefix = targetCode.replace(/[0-9]/g, '');
      const apiKey = state.airlabsApiKey || DEFAULT_AIRLABS_API_KEY;
      if (AIRLINE_PREFIX_MAP[prefix]) fl.airline = AIRLINE_PREFIX_MAP[prefix];

      let matched = false;

      // 1. Primary Global Real-Time Query via AirLabs API (https://airlabs.co/api/v9/flight)
      if (apiKey) {
        try {
          const url = `https://airlabs.co/api/v9/flight?flight_iata=${encodeURIComponent(targetCode)}&api_key=${encodeURIComponent(apiKey)}`;
          const res = await fetch(url);
          const json = await res.json();
          const d = json && json.response;

          if (d && (d.dep_iata || d.arr_iata || d.flight_iata)) {
            matched = true;
            fl.code = d.flight_iata || targetCode;
            fl.airline = AIRLINE_PREFIX_MAP[prefix] || d.airline_name || fl.airline;
            fl.depCode = d.dep_iata || '---';
            fl.depCity = AIRPORT_CITY_MAP[fl.depCode] || d.dep_city || d.dep_name || fl.depCode;
            fl.arrCode = d.arr_iata || '---';
            fl.arrCity = AIRPORT_CITY_MAP[fl.arrCode] || d.arr_city || d.arr_name || fl.arrCode;

            fl.terminal = d.dep_terminal || d.arr_terminal || 'T1';
            fl.gate = d.dep_gate || d.arr_gate || '--';
            fl.belt = d.arr_baggage || d.aircraft_icao || '--';
            fl.aircraft = d.aircraft_icao || '--';

            const depLocal = d.dep_estimated || d.dep_time || '';
            const arrLocal = d.arr_estimated || d.arr_time || '';
            fl.depTime = depLocal ? String(depLocal).slice(-5) : '';
            fl.arrTime = arrLocal ? String(arrLocal).slice(-5) : '';

            fl.depTs = parseAirLabsTimeToEpochMs(d.dep_estimated_ts || d.dep_time_ts, d.dep_estimated_utc || d.dep_time_utc);
            fl.arrTs = parseAirLabsTimeToEpochMs(d.arr_estimated_ts || d.arr_time_ts, d.arr_estimated_utc || d.arr_time_utc);

            const statusRaw = String(d.status || '').toLowerCase();
            fl.flightStatus = statusRaw || 'scheduled';
            const delayMins = Math.max(Number(d.delayed) || 0, Number(d.dep_delayed) || 0, Number(d.arr_delayed) || 0);

            if (statusRaw === 'cancelled') {
              fl.isDelayed = true;
              fl.statusText = '航班取消';
              fl.remainText = '已取消';
              fl.progress = 8;
            } else if (delayMins >= 15) {
              fl.isDelayed = true;
              fl.statusText = `延誤 ${delayMins} 分`;
              fl.remainText = `延誤 ${delayMins} 分`;
              fl.progress = statusRaw === 'en-route' ? 55 : 18;
            } else if (statusRaw === 'landed') {
              fl.isDelayed = false;
              fl.statusText = '已降落 · 準時';
              fl.remainText = '已抵達 100%';
              fl.progress = 100;
            } else if (statusRaw === 'en-route') {
              fl.isDelayed = false;
              fl.statusText = '飛行中 · 準時';
              fl.progress = typeof d.percent === 'number' && d.percent > 0 ? Math.min(99, Math.round(d.percent)) : 55;
              fl.remainText = typeof d.duration === 'number' ? formatMinsRemain(d.duration * (1 - fl.progress / 100)) : '飛行中';
            } else {
              fl.isDelayed = false;
              fl.statusText = '準時';
              fl.remainText = fl.depTime ? `預計 ${fl.depTime} 起飛` : '待起飛';
              fl.progress = 15;
            }

            recalcFlightProgressFromClock(false);
          }
        } catch (e) {}
      }

      if (!matched) {
        fl.depCode = '待查詢';
        fl.depCity = '暫無動態';
        fl.arrCode = targetCode;
        fl.arrCity = '未起飛/無班次';
        fl.terminal = '--';
        fl.gate = '--';
        fl.belt = '--';
        fl.isDelayed = false;
        fl.statusText = '暫無當下動態';
        fl.remainText = '尚未起飛或無此班次';
        fl.progress = 15;
      }

      fl.lastUpdated = new Date().toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit' });
      saveState();
      renderBoard();
      if (!document.getElementById('settingsModal').classList.contains('hidden')) {
        openWidgetSettings('flight');
      }
      if (manual) {
        showToast(matched
          ? `✓ 已從 AirLabs 取得 ${fl.code}（${fl.depCode} → ${fl.arrCode}）實時資料`
          : `暫未偵測到 ${targetCode} 正在執飛或今日班次`);
      }
    }

    async function fetchFinanceLive(manual = false) {
      const symbols = Object.keys(ALL_FINANCE_TICKERS);
      let updatedCount = 0;

      if (state.finnhubApiKey) {
        for (const sym of symbols) {
          try {
            const res = await fetch(`https://finnhub.io/api/v1/quote?symbol=${sym}&token=${encodeURIComponent(state.finnhubApiKey)}`);
            const q = await res.json();
            if (q && typeof q.c === 'number' && q.c > 0) {
              ALL_FINANCE_TICKERS[sym].price = '$' + q.c.toFixed(2);
              const dp = Number(q.dp || 0);
              ALL_FINANCE_TICKERS[sym].change = `${dp >= 0 ? '+' : ''}${dp.toFixed(2)}%`;
              ALL_FINANCE_TICKERS[sym].up = dp >= 0;
              updatedCount++;
            }
          } catch (e) {}
        }
      }

      if (updatedCount === 0) {
        try {
          const targetUrl = `https://query1.finance.yahoo.com/v7/finance/spark?symbols=${symbols.join(',')}&range=1d&interval=5m`;
          const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;
          const res = await fetch(proxyUrl);
          const data = await res.json();
          const results = data && data.spark && data.spark.result;
          if (Array.isArray(results)) {
            results.forEach(item => {
              const sym = item.symbol;
              const meta = item.response && item.response[0] && item.response[0].meta;
              if (ALL_FINANCE_TICKERS[sym] && meta && typeof meta.regularMarketPrice === 'number') {
                const price = meta.regularMarketPrice;
                const prev = meta.chartPreviousClose || meta.previousClose || price;
                const pct = prev ? ((price - prev) / prev) * 100 : 0;
                ALL_FINANCE_TICKERS[sym].price = '$' + price.toFixed(2);
                ALL_FINANCE_TICKERS[sym].change = `${pct >= 0 ? '+' : ''}${pct.toFixed(2)}%`;
                ALL_FINANCE_TICKERS[sym].up = pct >= 0;
                updatedCount++;
              }
            });
          }
        } catch (e) {}
      }

      if (updatedCount > 0) {
        renderBoard();
      }
      if (manual) {
        showToast(updatedCount > 0 ? `✓ 已更新 ${updatedCount} 隻美股即時報價` : '已使用最新緩存美股報價');
      }
    }

    function refreshAllLive() {
      showToast('正在刷新全部即時數據...');
      fetchWeatherAndNews();
      fetchRthkNewsLive(false);
      fetchFinanceLive(false);
      fetchFlightLive(false);
      refreshTransitLive(false);
      syncGoogleSheetTodos(false);
      syncFamilyMessageSheet(false);
    }

    /* Boot Initialization */
    window.addEventListener('resize', () => {
      renderBoard();
    });

    window.onload = function () {
      applyTheme();
      updateGlobalTitleTagUI();
      recalcFlightProgressFromClock(false);
      renderBoard();

      setInterval(updateLiveClocksOnly, 1000);

      setInterval(() => {
        refreshTransitLive(false);
      }, 25000);

      setInterval(() => {
        applyTheme();
        recalcFlightProgressFromClock(true);
      }, 60000);

      setInterval(() => {
        fetchRthkNewsLive(false);
        fetchFinanceLive(false);
      }, 600000);

      fetchWeatherAndNews();
      fetchRthkNewsLive(false);
      fetchFinanceLive(false);
      fetchFlightLive(false);
      refreshTransitLive(false);
      syncGoogleSheetTodos(false);
      syncFamilyMessageSheet(false);
    };
  </script>
