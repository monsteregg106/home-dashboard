    function getSeveritySortRank(rawVal) {
      const s = String(rawVal || '').trim().toLowerCase();
      if (!s) return 2;
      if (s.includes('🔴') || s.includes('🚨') || s.includes('🔥') || s.includes('❗') || s.includes('‼') || s.includes('高') || s.includes('急') || s.includes('high')) return 1;
      if (s.includes('🟢') || s.includes('🔵') || s.includes('✅') || s.includes('🌿') || s.includes('低') || s.includes('low')) return 3;
      return 2;
    }

    function parseSheetDueCell(cell) {
      const hk = getHkDateParts();
      const todayObj = new Date(hk.year, hk.month - 1, hk.day);
      const isoDay = todayObj.getDay() === 0 ? 7 : todayObj.getDay();
      const mondayOfWeek = new Date(hk.year, hk.month - 1, hk.day - (isoDay - 1));
      const sundayOfWeek = new Date(hk.year, hk.month - 1, hk.day + (7 - isoDay));

      if (!cell || (cell.v === null && cell.v === undefined && !cell.f)) {
        return { isToday: false, isThisWeek: false, parsed: false };
      }

      let targetDate = null;
      const rawV = cell.v !== null && cell.v !== undefined ? String(cell.v).trim() : '';
      const dispStr = formatGvizCellDisplay(cell);
      const lower = dispStr.toLowerCase().trim();

      if (!lower) {
        return { isToday: false, isThisWeek: false, parsed: false };
      }

      const gvizDateMatch = rawV.match(/^Date\((\d+),(\d+),(\d+)/);
      if (gvizDateMatch) {
        targetDate = new Date(Number(gvizDateMatch[1]), Number(gvizDateMatch[2]), Number(gvizDateMatch[3]));
      } else if (lower === '今日' || lower === '今天' || lower === 'today') {
        return { isToday: true, isThisWeek: true, parsed: true };
      } else if (lower === '明日' || lower === '明天' || lower === 'tomorrow') {
        return { isToday: false, isThisWeek: isoDay < 7, parsed: true };
      } else if (lower === '今個星期' || lower === '今星期' || lower === '本週' || lower === '本周' || lower === '這週' || lower === 'this week' || lower === 'week') {
        return { isToday: false, isThisWeek: true, parsed: true };
      } else {
        const ymd = dispStr.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
        const cjk = dispStr.match(/^(?:(\d{4})年)?(\d{1,2})月(\d{1,2})日?$/);
        const sm = dispStr.match(/^(\d{1,2})[-/.](\d{1,2})(?:[-/.](\d{2,4}))?$/);
        if (ymd) {
          targetDate = new Date(Number(ymd[1]), Number(ymd[2]) - 1, Number(ymd[3]));
        } else if (cjk) {
          const yr = cjk[1] ? Number(cjk[1]) : hk.year;
          targetDate = new Date(yr, Number(cjk[2]) - 1, Number(cjk[3]));
        } else if (sm) {
          const a = Number(sm[1]);
          const b = Number(sm[2]);
          const yr = sm[3] ? (sm[3].length === 2 ? 2000 + Number(sm[3]) : Number(sm[3])) : hk.year;
          const isDayFirst = a > 12 || (a <= 12 && b <= 12);
          const month = isDayFirst ? b : a;
          const day = isDayFirst ? a : b;
          targetDate = new Date(yr, month - 1, day);
        }
      }

      if (targetDate && !isNaN(targetDate.getTime())) {
        const isToday = targetDate.getTime() === todayObj.getTime();
        const isThisWeek = isToday || (targetDate >= mondayOfWeek && targetDate <= sundayOfWeek);
        return { isToday, isThisWeek, parsed: true };
      }

      return { isToday: false, isThisWeek: false, parsed: false };
    }

    async function syncGoogleSheetTodos(silent = true) {
      const targetUrl = (state.googleSheetUrl || DEFAULT_SHARED_SHEET_URL || '').trim();
      if (!targetUrl) return;
      const idMatch = targetUrl.match(/\/d\/([a-zA-Z0-9-_]+)/);
      if (!idMatch) {
        if (!silent) showToast('⚠️ Google Sheet 網址格式不正確');
        return;
      }
      const sheetId = idMatch[1];
      const customTab = (state.googleSheetTab || '').trim();

      try {
        let data = null;
        if (customTab) {
          const attempt = await fetchGvizTabJson(sheetId, customTab);
          if (attempt && attempt.status !== 'error' && attempt.table) {
            data = attempt;
          }
        }
        if (!data) {
          data = await fetchGvizTabJson(sheetId, '');
        }
        if (!data || data.status === 'error' || !data.table) {
          throw new Error('Cannot load first tab');
        }

        const cols = (data.table.cols || []).map(c => (c.label || '').trim());
        const rows = data.table.rows || [];

        const isHeaderRowMatch = (arr) => arr.some(lbl => {
          const l = String(lbl || '').trim().toLowerCase();
          return l === '任務' || l === '待辦' || l.includes('嚴重') || l.includes('程度') || l.includes('到期') || l.includes('負責') || l === 'task' || l === 'due' || l === 'owner';
        });

        let headerLabels = cols;
        let dataRows = rows;

        if (!isHeaderRowMatch(cols) && rows.length > 0) {
          const firstRowTexts = (rows[0].c || []).map(cell => formatGvizCellDisplay(cell));
          if (isHeaderRowMatch(firstRowTexts)) {
            headerLabels = firstRowTexts;
            dataRows = rows.slice(1);
          }
        }

        const isTaskHeader = (lbl) => ['任務', '待辦', '事項', 'task', 'todo', 'item'].includes(String(lbl || '').trim().toLowerCase());

        let taskIdx = headerLabels.findIndex(c => {
          const l = String(c || '').toLowerCase();
          return l.includes('任務') || l.includes('待辦') || l.includes('事項') || l.includes('task') || l.includes('todo');
        });
        if (taskIdx === -1) taskIdx = 0;

        let sevIdx = headerLabels.findIndex(c => {
          const l = String(c || '').toLowerCase();
          return l.includes('嚴重') || l.includes('程度') || l.includes('優先') || l.includes('級別') || l.includes('sev') || l.includes('priority');
        });
        if (sevIdx === -1) sevIdx = 1;

        let dueIdx = headerLabels.findIndex(c => {
          const l = String(c || '').toLowerCase();
          return l.includes('到期') || l.includes('期限') || l.includes('日期') || l.includes('due') || l.includes('date') || l.includes('deadline');
        });

        let ownerIdx = headerLabels.findIndex(c => {
          const l = String(c || '').toLowerCase();
          return l.includes('負責') || l.includes('成員') || l.includes('邊個') || l.includes('owner') || l.includes('assignee') || l.includes('who') || l.includes('person');
        });

        if (dueIdx === -1 || ownerIdx === -1) {
          const sampleRows = dataRows.slice(0, 12);
          const colCount = Math.max(headerLabels.length, ...sampleRows.map(r => (r.c || []).length));
          for (let ci = 0; ci < colCount; ci++) {
            if (ci === taskIdx || ci === sevIdx) continue;
            const vals = sampleRows.map(r => (r.c || [])[ci]).filter(Boolean);
            if (vals.length === 0) continue;

            if (dueIdx === -1) {
              const dateHits = vals.filter(cell => parseSheetDueCell(cell).parsed).length;
              if (dateHits > 0) {
                dueIdx = ci;
                continue;
              }
            }

            if (ownerIdx === -1 && ci !== dueIdx) {
              const texts = vals.map(cell => formatGvizCellDisplay(cell)).filter(Boolean);
              const avgLen = texts.reduce((s, t) => s + t.length, 0) / Math.max(1, texts.length);
              if (texts.length > 0 && avgLen <= 12) {
                ownerIdx = ci;
              }
            }
          }
        }

        const prevDoneMap = new Map((state.todos || []).map(t => [t.text, Boolean(t.done)]));

        const imported = [];
        dataRows.forEach((r, idx) => {
          const cells = r.c || [];
          const taskText = formatGvizCellDisplay(cells[taskIdx]);
          if (!taskText || isTaskHeader(taskText)) return;

          const rawSev = sevIdx >= 0 ? formatGvizCellDisplay(cells[sevIdx]) : '';
          const dueInfo = dueIdx >= 0 ? parseSheetDueCell(cells[dueIdx]) : { isToday: false, isThisWeek: false };
          const ownerText = ownerIdx >= 0 ? formatGvizCellDisplay(cells[ownerIdx]) : '';

          imported.push({
            id: 'gs_td_' + idx + '_' + Date.now(),
            text: taskText,
            severity: rawSev,
            sevRank: getSeveritySortRank(rawSev),
            isToday: dueInfo.isToday,
            isThisWeek: dueInfo.isThisWeek,
            owner: ownerText || '共同',
            done: prevDoneMap.get(taskText) || false
          });
        });

        state.todos = imported;
        saveState();
        renderBoard();
        if (!silent) {
          showToast(imported.length > 0 ? `✓ 已同步 ${imported.length} 項待辦任務` : '第一個分頁暫無待辦任務');
        }
      } catch (e) {
        if (!silent) showToast('⚠️ 無法讀取 Google Sheet 第一個分頁，請確認共用權限設為公開檢視');
      }
    }

    /* Message Board Google Sheet Sync (Targets second tab "家庭留言板" & supports single-column "留言內容") */
    function formatGvizCellDisplay(cell) {
      if (!cell) return '';
      if (cell.f) return String(cell.f).trim();
      if (cell.v === null || cell.v === undefined) return '';
      const raw = String(cell.v).trim();
      const dateMatch = raw.match(/^Date\((\d+),(\d+),(\d+)(?:,(\d+),(\d+))?/);
      if (dateMatch) {
        const mm = String(Number(dateMatch[2]) + 1).padStart(2, '0');
        const dd = String(Number(dateMatch[3])).padStart(2, '0');
        if (dateMatch[4] !== undefined && dateMatch[5] !== undefined) {
          const hh = String(Number(dateMatch[4])).padStart(2, '0');
          const min = String(Number(dateMatch[5])).padStart(2, '0');
          return `${mm}/${dd} ${hh}:${min}`;
        }
        return `${mm}/${dd}`;
      }
      return raw;
    }

    async function fetchGvizTabJson(sheetId, tabName) {
      const baseGviz = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json`;
      const url = tabName ? `${baseGviz}&sheet=${encodeURIComponent(tabName)}` : baseGviz;
      const res = await fetch(url);
      const text = await res.text();
      const jsonStr = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
      return JSON.parse(jsonStr);
    }

    async function syncGoogleSheetMessages(silent = true) {
      const targetUrl = (state.messageSheetUrl || DEFAULT_MESSAGE_SHEET_URL || '').trim();
      if (!targetUrl) return;

      const idMatch = targetUrl.match(/\/d\/([a-zA-Z0-9-_]+)/);
      if (!idMatch) {
        if (!silent) showToast('⚠️ Google Sheet 網址格式不正確');
        return;
      }

      const sheetId = idMatch[1];
      const primaryTab = (state.messageSheetTab || DEFAULT_MESSAGE_SHEET_TAB).trim();
      const candidateTabs = Array.from(new Set([primaryTab, '家庭留言板', '留言板', 'Sheet2', '工作表2'].filter(Boolean)));

      try {
        let data = null;
        let matchedTab = primaryTab;

        for (const candidate of candidateTabs) {
          const attempt = await fetchGvizTabJson(sheetId, candidate);
          if (attempt && attempt.status !== 'error' && attempt.table) {
            data = attempt;
            matchedTab = candidate;
            break;
          }
        }

        if (!data || data.status === 'error' || !data.table) {
          throw new Error('Cannot locate second tab');
        }

        if (matchedTab && state.messageSheetTab !== matchedTab) {
          state.messageSheetTab = matchedTab;
          saveState();
        }

        const cols = (data.table.cols || []).map(c => (c.label || '').trim());
        const rows = data.table.rows || [];

        const isHeaderLabel = (lbl) => {
          const l = String(lbl || '').trim().toLowerCase();
          return ['留言內容', '留言', '內容', '訊息', 'message', 'text', 'content'].includes(l);
        };

        const hasHeaderKeywords = cols.some(lbl => {
          const l = lbl.toLowerCase();
          return l.includes('留言') || l.includes('內容') || l.includes('訊息') || l.includes('時間') || l.includes('日期') || l.includes('負責') || l.includes('人') || l.includes('message') || l.includes('text') || l.includes('author') || l.includes('time') || l.includes('date') || l.includes('timestamp');
        });

        let msgIdx = cols.findIndex(c => {
          const l = c.toLowerCase();
          return l.includes('內容') || l.includes('留言') || l.includes('訊息') || l.includes('message') || l.includes('text') || l.includes('content');
        });
        let authorIdx = cols.findIndex(c => {
          const l = c.toLowerCase();
          return l.includes('留言人') || l.includes('人') || l.includes('邊個') || l.includes('負責') || l.includes('作者') || l.includes('author') || l.includes('name') || l.includes('who');
        });
        let timeIdx = cols.findIndex(c => {
          const l = c.toLowerCase();
          return l.includes('時間') || l.includes('日期') || l.includes('timestamp') || l.includes('time') || l.includes('date');
        });

        if (msgIdx === -1) {
          if (cols.length <= 1) {
            msgIdx = 0;
          } else if (cols.length === 2) {
            if (timeIdx === 0) {
              msgIdx = 1;
            } else {
              authorIdx = authorIdx === -1 ? 0 : authorIdx;
              msgIdx = 1;
            }
          } else {
            if (timeIdx === 0) {
              authorIdx = authorIdx === -1 ? 1 : authorIdx;
              msgIdx = 2;
            } else {
              authorIdx = authorIdx === -1 ? 0 : authorIdx;
              msgIdx = 1;
              timeIdx = timeIdx === -1 ? 2 : timeIdx;
            }
          }
        }

        const rawMatrix = [];
        const meaningfulCols = cols.filter(lbl => lbl && !/^[A-Z]$/.test(lbl));
        if (!hasHeaderKeywords && meaningfulCols.length > 0) {
          rawMatrix.push(cols.map(lbl => ({ v: lbl, f: lbl })));
        }
        rows.forEach(r => rawMatrix.push(r.c || []));

        const imported = [];
        rawMatrix.forEach((cells, idx) => {
          const msgText = formatGvizCellDisplay(cells[msgIdx]);
          if (!msgText || isHeaderLabel(msgText)) return;
          const authorText = authorIdx >= 0 ? formatGvizCellDisplay(cells[authorIdx]) : '';
          const timeText = timeIdx >= 0 ? formatGvizCellDisplay(cells[timeIdx]) : '';
          imported.push({
            id: 'gs_msg_' + idx + '_' + Date.now(),
            author: authorText,
            time: timeText,
            text: msgText
          });
        });

        if (imported.length > 0) {
          state.messages = imported.reverse();
          saveState();
          renderBoard();
          if (!silent) showToast(`✓ 已從「${matchedTab}」同步 ${imported.length} 則留言`);
        } else {
          state.messages = [];
          saveState();
          renderBoard();
          if (!silent) showToast(`「${matchedTab}」分頁暫無留言內容`);
        }
      } catch (e) {
        if (!silent) showToast(`⚠️ 找不到「${primaryTab}」分頁，請在設定確認分頁名稱及公開檢視權限`);
      }
    }

    async function syncGoogleCalendarApi(silent = true) {
      if (!state.googleApiKey || !state.googleCalendarId) return;
      const calId = encodeURIComponent(state.googleCalendarId);
      const timeMin = encodeURIComponent(new Date().toISOString());
      const url = `https://www.googleapis.com/calendar/v3/calendars/${calId}/events?key=${encodeURIComponent(state.googleApiKey)}&timeMin=${timeMin}&singleEvents=true&orderBy=startTime&maxResults=12`;

      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error('API Error');
        const data = await res.json();
        const items = data.items || [];
        if (items.length > 0) {
          state.calendarEvents = items.map((ev, i) => {
            const startRaw = ev.start?.dateTime || ev.start?.date || '';
            const datePart = startRaw.slice(0, 10) || '2026-11-21';
            const timePart = startRaw.includes('T') ? startRaw.slice(11, 16) : '全日';
            return {
              id: 'gcal_' + i,
              title: ev.summary || '未命名行程',
              date: datePart,
              time: timePart,
              owner: '共同'
            };
          });
          saveState();
          renderBoard();
          if (!silent) showToast(`✓ 已同步 ${items.length} 個 Google 日曆行程`);
        }
      } catch (e) {
        if (!silent) showToast('⚠️ Google Calendar 同步失敗，請檢查 API Key 與日曆公開設定');
      }
    }

    function buildCloudPayload() {
      const hk = getHkDateParts();
      const stamp = `${hk.year}-${String(hk.month).padStart(2, '0')}-${String(hk.day).padStart(2, '0')} ${String(hk.h24).padStart(2, '0')}:${hk.m}`;
      return {
        version: 1,
        updatedAt: stamp,
        theme: state.theme,
        totalPages: state.totalPages,
        hideAllTitles: Boolean(state.hideAllTitles),
        weatherDistrict: state.weatherDistrict,
        worldCity: state.worldCity,
        savedIcsUrl: state.savedIcsUrl,
        googleApiKey: state.googleApiKey,
        googleCalendarId: state.googleCalendarId,
        googleSheetUrl: state.googleSheetUrl,
        googleSheetTab: state.googleSheetTab,
        messageSheetUrl: state.messageSheetUrl || DEFAULT_MESSAGE_SHEET_URL,
        messageSheetTab: state.messageSheetTab || DEFAULT_MESSAGE_SHEET_TAB,
        messageFontSize: Number(state.messageFontSize) || 20,
        messageBgColor: state.messageBgColor || '',
        messageTextColor: state.messageTextColor || '',
        todoFilterDue: state.todoFilterDue,
        todoFilterSeverity: state.todoFilterSeverity,
        todoFilterOwner: state.todoFilterOwner,
        financeTickers: state.financeTickers,
        showFinanceRates: state.showFinanceRates !== false,
        showFinanceGold: state.showFinanceGold !== false,
        showFinanceIndices: state.showFinanceIndices !== false,
        financeMarqueeExtra: Boolean(state.financeMarqueeExtra),
        financeCurrencies: state.financeCurrencies,
        widgets: state.widgets,
        flights: state.flights,
        transitItems: state.transitItems
      };
    }

    function applyCloudPayload(payload) {
      if (!payload || !Array.isArray(payload.widgets)) return false;
      if (payload.theme) setTheme(payload.theme);
      if (typeof payload.totalPages === 'number') state.totalPages = Math.max(1, Math.min(6, payload.totalPages));
      if (typeof payload.hideAllTitles === 'boolean') state.hideAllTitles = payload.hideAllTitles;
      if (typeof payload.weatherDistrict === 'string' && HK_DISTRICTS[payload.weatherDistrict]) state.weatherDistrict = payload.weatherDistrict;
      if (typeof payload.worldCity === 'string' && WORLD_CITIES[payload.worldCity]) state.worldCity = payload.worldCity;
      if (typeof payload.googleApiKey === 'string') state.googleApiKey = payload.googleApiKey;
      if (typeof payload.googleCalendarId === 'string') state.googleCalendarId = payload.googleCalendarId;
      if (typeof payload.todoFilterDue === 'string') state.todoFilterDue = payload.todoFilterDue;
      if (typeof payload.todoFilterSeverity === 'string') state.todoFilterSeverity = payload.todoFilterSeverity;
      if (typeof payload.todoFilterOwner === 'string') state.todoFilterOwner = payload.todoFilterOwner;

      if (typeof payload.googleSheetUrl === 'string' && payload.googleSheetUrl.trim()) {
        state.googleSheetUrl = payload.googleSheetUrl;
      } else if (!state.googleSheetUrl) {
        state.googleSheetUrl = DEFAULT_SHARED_SHEET_URL;
      }
      if (typeof payload.googleSheetTab === 'string') state.googleSheetTab = payload.googleSheetTab;
      if (typeof payload.messageSheetUrl === 'string' && payload.messageSheetUrl.trim()) {
        state.messageSheetUrl = payload.messageSheetUrl;
      } else if (!state.messageSheetUrl) {
        state.messageSheetUrl = DEFAULT_MESSAGE_SHEET_URL;
      }
      if (typeof payload.messageSheetTab === 'string' && payload.messageSheetTab.trim()) {
        state.messageSheetTab = payload.messageSheetTab;
      } else if (!state.messageSheetTab) {
        state.messageSheetTab = DEFAULT_MESSAGE_SHEET_TAB;
      }
      if (typeof payload.messageFontSize === 'number') state.messageFontSize = payload.messageFontSize;
      if (typeof payload.messageBgColor === 'string') state.messageBgColor = payload.messageBgColor;
      if (typeof payload.messageTextColor === 'string') state.messageTextColor = payload.messageTextColor;

      if (Array.isArray(payload.financeTickers)) state.financeTickers = payload.financeTickers;
      if (typeof payload.showFinanceRates === 'boolean') state.showFinanceRates = payload.showFinanceRates;
      if (typeof payload.showFinanceGold === 'boolean') state.showFinanceGold = payload.showFinanceGold;
      if (typeof payload.showFinanceIndices === 'boolean') state.showFinanceIndices = payload.showFinanceIndices;
      if (typeof payload.financeMarqueeExtra === 'boolean') state.financeMarqueeExtra = payload.financeMarqueeExtra;
      if (Array.isArray(payload.financeCurrencies) && payload.financeCurrencies.length > 0) {
        state.financeCurrencies = payload.financeCurrencies;
      }
      if (Array.isArray(payload.flights)) state.flights = payload.flights.map(normalizeFlightItem);
      if (Array.isArray(payload.transitItems)) state.transitItems = payload.transitItems;

      state.widgets = payload.widgets;
      DEFAULT_WIDGETS.forEach(dw => {
        const found = state.widgets.find(w => w.id === dw.id);
        if (!found) {
          state.widgets.push(JSON.parse(JSON.stringify(dw)));
        } else {
          if (typeof found.fontScale !== 'number') found.fontScale = 1;
          if (typeof found.mobColSpan !== 'number') found.mobColSpan = dw.mobColSpan;
          if (typeof found.mobRowSpan !== 'number') found.mobRowSpan = dw.mobRowSpan;
          if (typeof found.showTitle !== 'boolean') found.showTitle = true;
        }
      });

      if (state.currentPage > state.totalPages) state.currentPage = 1;
      if (payload.updatedAt) state.lastCloudSyncTime = payload.updatedAt;
      saveState();
      updateCloudIndicatorUI();
      updateGlobalTitleTagUI();
      renderBoard();
      if (state.googleSheetUrl || DEFAULT_SHARED_SHEET_URL) syncGoogleSheetTodos(true);
      if (state.messageSheetUrl || DEFAULT_MESSAGE_SHEET_URL) syncGoogleSheetMessages(true);
      return true;
    }

    async function saveLayoutToGitHub() {
      const tokenInp = document.getElementById('ghTokenInput');
      const gistInp = document.getElementById('ghGistIdInput');
      if (tokenInp) state.githubToken = tokenInp.value.trim();
      if (gistInp) state.githubGistId = gistInp.value.trim();
      saveState();

      if (!state.githubToken) {
        openCloudSyncModal();
        showToast('⚠️ 請先輸入 GitHub Token');
        return;
      }

      const payload = buildCloudPayload();
      const bodyObj = {
        description: 'Miranda & Angus Home Dashboard Layout',
        public: false,
        files: {
          'home-dashboard-layout.json': {
            content: JSON.stringify(payload, null, 2)
          }
        }
      };

      const isUpdate = Boolean(state.githubGistId);
      const endpoint = isUpdate
        ? `https://api.github.com/gists/${encodeURIComponent(state.githubGistId)}`
        : 'https://api.github.com/gists';

      try {
        showToast('☁️ 正在儲存排版到 GitHub...');
        const res = await fetch(endpoint, {
          method: isUpdate ? 'PATCH' : 'POST',
          headers: {
            'Accept': 'application/vnd.github+json',
            'Authorization': `Bearer ${state.githubToken}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(bodyObj)
        });

        if (!res.ok) throw new Error('GitHub API ' + res.status);
        const data = await res.json();
        if (data && data.id) {
          state.githubGistId = data.id;
          state.lastCloudSyncTime = payload.updatedAt;
          saveState();
          updateCloudIndicatorUI();
          if (!document.getElementById('cloudSyncModal')?.classList.contains('hidden')) {
            openCloudSyncModal();
          }
          showToast('✓ 已儲存排版到 GitHub 雲端');
        }
      } catch (e) {
        showToast('⚠️ GitHub 儲存失敗，請確認 Token 具備 gist 權限');
      }
    }

    async function loadLayoutFromGitHub(silent = true) {
      const tokenInp = document.getElementById('ghTokenInput');
      const gistInp = document.getElementById('ghGistIdInput');
      if (tokenInp && tokenInp.value.trim()) state.githubToken = tokenInp.value.trim();
      if (gistInp && gistInp.value.trim()) state.githubGistId = gistInp.value.trim();
      saveState();

      if (!state.githubGistId) {
        if (!silent) showToast('⚠️ 請先輸入 Gist ID 或先儲存一次排版');
        return;
      }

      const headers = { 'Accept': 'application/vnd.github+json' };
      if (state.githubToken) {
        headers['Authorization'] = `Bearer ${state.githubToken}`;
      }

      try {
        const res = await fetch(`https://api.github.com/gists/${encodeURIComponent(state.githubGistId)}`, { headers });
        if (!res.ok) throw new Error('GitHub Load ' + res.status);
        const data = await res.json();
        const fileObj = data?.files?.['home-dashboard-layout.json'] || Object.values(data?.files || {})[0];
        if (!fileObj || !fileObj.content) throw new Error('Empty Gist');
        const parsed = JSON.parse(fileObj.content);
        if (applyCloudPayload(parsed) && !silent) {
          showToast('✓ 已從 GitHub 載入最新排版');
        }
      } catch (e) {
        if (!silent) showToast('⚠️ 無法從 GitHub 載入排版，請檢查 Gist ID 或 Token');
      }
    }

    function copyIpadSyncUrl() {
      const gistInp = document.getElementById('ghGistIdInput');
      const tokenInp = document.getElementById('ghTokenInput');
      if (gistInp && gistInp.value.trim()) state.githubGistId = gistInp.value.trim();
      if (tokenInp && tokenInp.value.trim()) state.githubToken = tokenInp.value.trim();
      saveState();

      if (!state.githubGistId) {
        showToast('⚠️ 請先按「儲存排版到 GitHub」產生 Gist ID');
        return;
      }

      const baseUrl = `${window.location.origin}${window.location.pathname}`;
      const params = new URLSearchParams();
      params.set('gist', state.githubGistId);
      if (state.githubToken) params.set('token', state.githubToken);
      const syncUrl = `${baseUrl}?${params.toString()}`;

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(syncUrl).then(() => {
          showToast('✓ 已複製 iPad 6 專用同步網址！');
        }).catch(() => {
          fallbackCopyText(syncUrl);
        });
      } else {
        fallbackCopyText(syncUrl);
      }
    }

    function fallbackCopyText(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast('✓ 已複製 iPad 6 專用同步網址！');
      } catch (e) {
        showToast('請手動複製網址列連結');
      }
      document.body.removeChild(ta);
    }

    /* Weather, World Clock, Transit, News & Finance APIs */
    function changeWeatherDistrict(dist) {
      if (!HK_DISTRICTS[dist]) return;
      state.weatherDistrict = dist;
      saveState();
      fetchWeather();
      renderBoard();
    }

    function changeWorldCity(cityKey) {
      state.worldCity = cityKey;
      saveState();
      fetchWorldWeather();
      renderBoard();
    }

    function mapWmoToCondition(code) {
      if (code === 0) return { text: '晴朗', icon: 'fa-sun' };
      if (code <= 2) return { text: '大致天晴', icon: 'fa-cloud-sun' };
      if (code === 3) return { text: '多雲', icon: 'fa-cloud' };
      if (code >= 51 && code <= 67) return { text: '有雨', icon: 'fa-cloud-rain' };
      if (code >= 80 && code <= 82) return { text: '驟雨', icon: 'fa-cloud-showers-heavy' };
      if (code >= 95) return { text: '雷暴', icon: 'fa-cloud-bolt' };
      return { text: '多雲', icon: 'fa-cloud-sun' };
    }

    async function fetchWeather() {
      const coords = HK_DISTRICTS[state.weatherDistrict] || HK_DISTRICTS['深水埗'];
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${coords.lat}&longitude=${coords.lon}&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,uv_index_max&timezone=Asia%2FHong_Kong&forecast_days=6`;
        const res = await fetch(url);
        const data = await res.json();
        const curTemp = Math.round(data.current.temperature_2m);
        const curCond = mapWmoToCondition(data.current.weather_code);
        const daily = data.daily;
        const weekNames = ['日', '一', '二', '三', '四', '五', '六'];

        const forecast = [];
        for (let i = 1; i <= 5; i++) {
          const dObj = new Date(daily.time[i] + 'T00:00:00');
          const c = mapWmoToCondition(daily.weather_code[i]);
          forecast.push({
            dateNum: String(dObj.getDate()),
            day: weekNames[dObj.getDay()],
            icon: c.icon,
            high: Math.round(daily.temperature_2m_max[i]),
            low: Math.round(daily.temperature_2m_min[i])
          });
        }

        const nextCond = forecast[0]?.icon || '';
        const summaryText = curCond.icon.includes('rain')
          ? `${curCond.text}，外出請帶備雨具`
          : nextCond.includes('rain')
          ? `${curCond.text}，稍後間中有幾陣微雨`
          : `${curCond.text}，日間部分時間有陽光`;

        liveData.hkWeather = {
          temp: curTemp,
          condition: curCond.text,
          summary: summaryText,
          uvIndex: Math.round(daily.uv_index_max?.[0] ?? 5),
          icon: curCond.icon,
          high: Math.round(daily.temperature_2m_max[0]),
          low: Math.round(daily.temperature_2m_min[0]),
          forecast
        };
        renderBoard();
      } catch (e) {}
    }

    async function fetchWorldWeather() {
      const city = WORLD_CITIES[state.worldCity] || WORLD_CITIES.vancouver;
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${city.lat}&longitude=${city.lon}&current=temperature_2m,weather_code,is_day`;
        const res = await fetch(url);
        const data = await res.json();
        const cond = mapWmoToCondition(data.current.weather_code);
        liveData.worldWeather = {
          temp: Math.round(data.current.temperature_2m),
          condition: cond.text,
          icon: data.current.is_day ? cond.icon : 'fa-moon'
        };
        renderBoard();
      } catch (e) {}
    }

    async function fetchTransit() {
      for (const item of state.transitItems) {
        try {
          if (item.type === 'mtr') {
            const res = await fetch(`https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=${item.line}&sta=${item.station}`);
            const json = await res.json();
            const key = `${item.line}-${item.station}`;
            const dirArr = json?.data?.[key]?.[item.dir] || [];
            if (dirArr.length > 0 && dirArr[0].ttnt !== undefined) {
              liveData.transitEta[item.id] = Math.max(1, Number(dirArr[0].ttnt));
              continue;
            }
          } else if (item.type === 'bus' && item.company === 'CTB' && item.stopId && !item.stopId.startsWith('CUSTOM')) {
            const res = await fetch(`https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/${item.stopId}/${item.route}`);
            const json = await res.json();
            const valid = (json.data || []).find(x => x.eta);
            if (valid) {
              const diffMin = Math.max(1, Math.round((new Date(valid.eta) - new Date()) / 60000));
              liveData.transitEta[item.id] = diffMin;
              continue;
            }
          }
        } catch (e) {}

        if (typeof liveData.transitEta[item.id] !== 'number') {
          liveData.transitEta[item.id] = (Number(item.walkMins) || 5) + 3;
        }
      }
      renderBoard();
    }

    async function fetchNews() {
      try {
        const rssUrl = encodeURIComponent('https://rthk.hk/rthk/news/rss/c_expressnews_clocal.xml');
        const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${rssUrl}`);
        const data = await res.json();
        if (Array.isArray(data.items) && data.items.length > 0) {
          liveData.news = data.items.slice(0, 8).map(it => it.title.trim());
          renderBoard();
        }
      } catch (e) {}
    }

    async function fetchYahooQuote(symbol) {
      const target = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(symbol)}?interval=1d&range=1d`;
      const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(target)}`;
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 6000);
      try {
        const res = await fetch(proxyUrl, { signal: controller.signal });
        clearTimeout(timer);
        if (!res.ok) return null;
        const json = await res.json();
        const meta = json?.chart?.result?.[0]?.meta;
        if (!meta || typeof meta.regularMarketPrice !== 'number') return null;
        const price = meta.regularMarketPrice;
        const prev = meta.chartPreviousClose || meta.previousClose || price;
        const change = prev > 0 ? ((price - prev) / prev) * 100 : 0;
        return { price, change };
      } catch (e) {
        clearTimeout(timer);
        return null;
      }
    }

    async function fetchFinance() {
      if (!liveData.finance.assets) {
        liveData.finance.assets = {
          NVDA: { price: 142.85, change: 2.38 },
          AAPL: { price: 228.40, change: 0.94 },
          BTC:  { price: 91450,  change: 3.12 },
          ETH:  { price: 3120,   change: 1.85 }
        };
      }

      // 1. Live FX Rates
      try {
        const res = await fetch('https://open.er-api.com/v6/latest/USD');
        const data = await res.json();
        if (data && data.rates && data.rates.HKD) {
          const usdHkd = Number(data.rates.HKD);
          if (!liveData.finance.rates) liveData.finance.rates = {};
          Object.values(FINANCE_CURRENCIES).forEach(cur => {
            const usdToCur = cur.code === 'USD' ? 1 : Number(data.rates[cur.code]);
            if (usdToCur && usdToCur > 0) {
              liveData.finance.rates[cur.code] = ((usdHkd / usdToCur) * cur.unit).toFixed(4);
            }
          });
        }
      } catch (e) {}

      // 2. Live Bitcoin & Ethereum (CoinGecko)
      try {
        const cgRes = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum&vs_currencies=usd&include_24hr_change=true');
        if (cgRes.ok) {
          const cgData = await cgRes.json();
          if (cgData.bitcoin?.usd) {
            liveData.finance.assets.BTC = {
              price: Number(cgData.bitcoin.usd),
              change: Number(cgData.bitcoin.usd_24h_change || 0)
            };
          }
          if (cgData.ethereum?.usd) {
            liveData.finance.assets.ETH = {
              price: Number(cgData.ethereum.usd),
              change: Number(cgData.ethereum.usd_24h_change || 0)
            };
          }
        }
      } catch (e) {}

      // 3. Live Nvidia, Apple, Gold & Indices
      try {
        const [nvdaQ, aaplQ, goldQ, hsiQ, spQ] = await Promise.all([
          fetchYahooQuote('NVDA'),
          fetchYahooQuote('AAPL'),
          fetchYahooQuote('GC=F'),
          fetchYahooQuote('^HSI'),
          fetchYahooQuote('^GSPC')
        ]);
        if (nvdaQ) liveData.finance.assets.NVDA = nvdaQ;
        if (aaplQ) liveData.finance.assets.AAPL = aaplQ;
        if (goldQ) {
          const s = goldQ.change >= 0 ? '+' : '';
          liveData.finance.gold = `$${Math.round(goldQ.price).toLocaleString('en-US')} (${s}${goldQ.change.toFixed(1)}%)`;
        }
        if (hsiQ) {
          const s = hsiQ.change >= 0 ? '+' : '';
          liveData.finance.hsi = `${Math.round(hsiQ.price).toLocaleString('en-US')} (${s}${hsiQ.change.toFixed(1)}%)`;
        }
        if (spQ) {
          const s = spQ.change >= 0 ? '+' : '';
          liveData.finance.sp500 = `${Math.round(spQ.price).toLocaleString('en-US')} (${s}${spQ.change.toFixed(1)}%)`;
        }
      } catch (e) {}

      renderBoard();
    }

    function refreshAllLive() {
      fetchWeather();
      fetchWorldWeather();
      fetchTransit();
      fetchNews();
      fetchFinance();
      if (state.googleSheetUrl || DEFAULT_SHARED_SHEET_URL) syncGoogleSheetTodos(true);
      if (state.messageSheetUrl || DEFAULT_MESSAGE_SHEET_URL) syncGoogleSheetMessages(true);
      if (state.googleApiKey && state.googleCalendarId) syncGoogleCalendarApi(true);
      showToast('✓ 已刷新全部即時數據');
    }

    /* Bootstrap */
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const urlGist = urlParams.get('gist');
      const urlToken = urlParams.get('token');
      if (urlGist) {
        state.githubGistId = urlGist;
        if (urlToken) state.githubToken = urlToken;
        saveState();
        if (window.history && window.history.replaceState) {
          window.history.replaceState({}, document.title, window.location.pathname);
        }
      }

      setTheme(state.theme || 'auto');
      updateCloudIndicatorUI();
      updateGlobalTitleTagUI();
      renderBoard();

      if (state.githubGistId) {
        loadLayoutFromGitHub(true);
      }

      setInterval(updateClockDOM, 1000);

      setInterval(() => {
        if (!Array.isArray(state.flights) || state.flights.length === 0) return;
        let moved = false;
        state.flights.forEach(fl => {
          if (fl.progress > 0 && fl.progress < 100) {
            fl.progress = Math.min(100, fl.progress + 1);
            moved = true;
          }
        });
        if (moved) {
          saveState();
          renderBoard();
        }
      }, 180000);

      fetchWeather();
      fetchWorldWeather();
      fetchTransit();
      fetchNews();
      fetchFinance();
      if (state.googleSheetUrl || DEFAULT_SHARED_SHEET_URL) syncGoogleSheetTodos(true);
      if (state.messageSheetUrl || DEFAULT_MESSAGE_SHEET_URL) syncGoogleSheetMessages(true);
      if (state.googleApiKey && state.googleCalendarId) syncGoogleCalendarApi(true);

      setInterval(fetchTransit, 45000);
      setInterval(() => {
        if (state.googleSheetUrl || DEFAULT_SHARED_SHEET_URL) syncGoogleSheetTodos(true);
        if (state.messageSheetUrl || DEFAULT_MESSAGE_SHEET_URL) syncGoogleSheetMessages(true);
      }, 120000);
      setInterval(fetchWeather, 600000);
      setInterval(fetchNews, 300000);
      setInterval(fetchFinance, 300000);

      window.addEventListener('resize', () => renderBoard());
    });
  </script>
