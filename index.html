<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="智慧家庭中控台" />
  <title>Miranda & Angus 智慧家庭中控台</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Inter"', '"Noto Sans TC"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif']
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-canvas: #eef2f6;
      --card-bg: rgba(255, 255, 255, 0.84);
      --card-border: rgba(255, 255, 255, 0.72);
      --card-shadow: 0 10px 30px -8px rgba(15, 23, 42, 0.08);
      --text-primary: #0f172a;
      --accent-color: #4f46e5;
    }

    html.dark {
      --bg-canvas: #090d16;
      --card-bg: rgba(24, 31, 48, 0.82);
      --card-border: rgba(255, 255, 255, 0.09);
      --card-shadow: 0 14px 34px -10px rgba(0, 0, 0, 0.55);
      --text-primary: #f8fafc;
      --accent-color: #818cf8;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      font-family: "Inter", "Noto Sans TC", -apple-system, BlinkMacSystemFont, sans-serif;
      overflow-x: hidden;
      transition: background-color 0.35s ease, color 0.35s ease;
    }

    body {
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      background-image:
        radial-gradient(at 10% 10%, rgba(99, 102, 241, 0.14) 0px, transparent 45%),
        radial-gradient(at 90% 15%, rgba(14, 165, 233, 0.14) 0px, transparent 45%),
        radial-gradient(at 50% 95%, rgba(244, 63, 94, 0.09) 0px, transparent 50%);
    }

    /* Per-Widget Independent Scaled Typography Tokens */
    .fs-2xs { font-size: 0.72em; }
    .fs-xs  { font-size: 0.84em; }
    .fs-sm  { font-size: 0.98em; }
    .fs-md  { font-size: 1.15em; }
    .fs-lg  { font-size: 1.42em; }
    .fs-xl  { font-size: 2.05em; }
    .fs-2xl { font-size: 2.75em; }

    /* Oversized Apple StandBy / iPadOS Hero Metrics */
    .hero-clock-num {
      font-size: clamp(2.1em, 5.6vw, 6.0em);
      font-weight: 900;
      letter-spacing: -0.045em;
      line-height: 0.94;
    }
    .hero-temp-num {
      font-size: clamp(1.85em, 4.4vw, 4.5em);
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 0.95;
    }
    .hero-world-num {
      font-size: clamp(1.6em, 3.5vw, 3.6em);
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 0.96;
    }

    /* Bento Card Base */
    .bento-card {
      position: relative;
      display: flex;
      flex-direction: column;
      padding: 13px 15px;
      border-radius: 22px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      box-shadow: var(--card-shadow);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      overflow: hidden;
      user-select: none;
      transition: box-shadow 0.25s ease, border-color 0.25s ease, background 0.6s ease;
    }

    .bento-card > *:not(.sky-anim-layer) {
      position: relative;
      z-index: 2;
    }

    /* Dynamic Living Sky & Weather Card Themes */
    .bento-card.sky-clear-day {
      background: linear-gradient(145deg, #1b6ca8 0%, #2f89c5 52%, #5cb3e6 100%);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.34);
    }

    .bento-card.sky-cloudy-day {
      background: linear-gradient(145deg, #355c85 0%, #4e79a4 55%, #739bc2 100%);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.28);
    }

    .bento-card.sky-sunset {
      background: linear-gradient(145deg, #1e2f5b 0%, #6d3b7d 52%, #d96b43 100%);
      color: #ffffff;
      border-color: rgba(255, 214, 170, 0.32);
    }

    .bento-card.sky-clear-night {
      background: linear-gradient(155deg, #060a17 0%, #0f1b3d 55%, #1b2e5e 100%);
      color: #f8fafc;
      border-color: rgba(148, 163, 184, 0.26);
    }

    .bento-card.sky-cloudy-night {
      background: linear-gradient(155deg, #0b1121 0%, #17233c 55%, #263654 100%);
      color: #f8fafc;
      border-color: rgba(148, 163, 184, 0.24);
    }

    .bento-card.sky-rain {
      background: linear-gradient(150deg, #1a2639 0%, #2c3e55 55%, #415772 100%);
      color: #f8fafc;
      border-color: rgba(186, 230, 253, 0.26);
    }

    .bento-card.sky-storm {
      background: linear-gradient(155deg, #0d1326 0%, #1d1b4b 55%, #312e81 100%);
      color: #f8fafc;
      border-color: rgba(165, 180, 252, 0.28);
    }

    /* Animated Weather & Sky Layer */
    .sky-anim-layer {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
      border-radius: inherit;
    }

    .sky-sun-orb {
      position: absolute;
      top: -28px;
      right: -24px;
      width: 118px;
      height: 118px;
      border-radius: 9999px;
      background: radial-gradient(circle, rgba(254, 240, 138, 0.85) 0%, rgba(253, 224, 71, 0.34) 45%, rgba(253, 224, 71, 0) 72%);
      animation: sunPulse 6s ease-in-out infinite;
    }

    .sky-moon-orb {
      position: absolute;
      top: 10px;
      right: 16px;
      width: 44px;
      height: 44px;
      border-radius: 9999px;
      background: radial-gradient(circle at 35% 35%, rgba(254, 249, 195, 0.45), rgba(148, 163, 184, 0.06) 68%, transparent 75%);
      box-shadow: 0 0 28px rgba(254, 249, 195, 0.22);
      animation: sunPulse 7s ease-in-out infinite;
    }

    @keyframes sunPulse {
      0%, 100% { transform: scale(1); opacity: 0.88; }
      50% { transform: scale(1.14); opacity: 1; }
    }

    .sky-cloud {
      position: absolute;
      border-radius: 9999px;
      background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.34) 0%, rgba(255, 255, 255, 0.12) 55%, rgba(255, 255, 255, 0) 76%);
      filter: blur(4px);
    }

    .sky-cloud.night-cloud {
      background: radial-gradient(ellipse at center, rgba(148, 163, 184, 0.22) 0%, rgba(100, 116, 139, 0.08) 55%, rgba(100, 116, 139, 0) 76%);
    }

    .sky-cloud-1 {
      width: 170px;
      height: 48px;
      top: 14%;
      left: -40px;
      animation: cloudDrift 22s ease-in-out infinite alternate;
    }

    .sky-cloud-2 {
      width: 210px;
      height: 56px;
      top: 46%;
      right: -50px;
      animation: cloudDriftReverse 28s ease-in-out infinite alternate;
    }

    .sky-cloud-3 {
      width: 140px;
      height: 40px;
      bottom: 16%;
      left: 18%;
      animation: cloudDrift 19s ease-in-out infinite alternate;
    }

    @keyframes cloudDrift {
      0% { transform: translate3d(-12px, 0, 0); }
      100% { transform: translate3d(38px, -4px, 0); }
    }

    @keyframes cloudDriftReverse {
      0% { transform: translate3d(14px, 0, 0); }
      100% { transform: translate3d(-42px, 4px, 0); }
    }

    .sky-star {
      position: absolute;
      width: 2.5px;
      height: 2.5px;
      border-radius: 9999px;
      background: #ffffff;
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.85);
      animation: starTwinkle 3.2s ease-in-out infinite;
    }

    @keyframes starTwinkle {
      0%, 100% { opacity: 0.22; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.35); }
    }

    .sky-shooting-star {
      position: absolute;
      top: 18%;
      right: 22%;
      width: 56px;
      height: 1.5px;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.95), transparent);
      transform: rotate(-28deg);
      opacity: 0;
      animation: shootingStar 9s ease-in-out infinite;
    }

    @keyframes shootingStar {
      0%, 78% { opacity: 0; transform: translate3d(24px, -14px, 0) rotate(-28deg); }
      83% { opacity: 1; }
      90%, 100% { opacity: 0; transform: translate3d(-95px, 52px, 0) rotate(-28deg); }
    }

    .sky-raindrop {
      position: absolute;
      top: -24px;
      width: 1.5px;
      height: 16px;
      border-radius: 9999px;
      background: linear-gradient(to bottom, rgba(186, 230, 253, 0), rgba(186, 230, 253, 0.78));
      animation: rainFall 1.05s linear infinite;
    }

    @keyframes rainFall {
      0% { transform: translate3d(0, -10px, 0) rotate(12deg); opacity: 0; }
      20% { opacity: 0.85; }
      100% { transform: translate3d(-18px, 240px, 0) rotate(12deg); opacity: 0; }
    }

    .sky-lightning-flash {
      position: absolute;
      inset: 0;
      background: rgba(224, 231, 255, 0.32);
      opacity: 0;
      animation: lightningFlash 7.5s infinite;
    }

    @keyframes lightningFlash {
      0%, 88%, 92%, 95%, 100% { opacity: 0; }
      89%, 93% { opacity: 0.85; }
    }

    .wx-icon-float {
      animation: wxFloat 4s ease-in-out infinite;
    }

    @keyframes wxFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }

    .bento-card.edit-mode {
      cursor: grab;
      border: 2px dashed var(--accent-color) !important;
      padding-top: 34px;
      animation: wiggle 2.6s ease-in-out infinite;
    }
    .bento-card.edit-mode:active {
      cursor: grabbing;
    }

    @keyframes wiggle {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-0.28deg); }
      75% { transform: rotate(0.28deg); }
    }

    /* Desktop / Tablet Landscape 12x12 Micro-Grid */
    #boardStage {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      grid-template-rows: repeat(12, minmax(0, 1fr));
      gap: 12px;
      width: 100%;
      height: 100%;
    }

    /* Mobile Portrait 2-Column Compact Grid */
    @media (max-width: 767px) {
      #boardStage {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-auto-rows: 46px;
        grid-auto-flow: row dense;
        align-items: stretch;
        gap: 10px;
        height: auto;
        min-height: 0;
        padding-bottom: 16px;
      }
    }

    /* Custom Thin Scrollbars inside Cards */
    .transit-scroll::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    .transit-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .transit-scroll::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.35);
      border-radius: 999px;
    }

    /* Seamless Dual-Track GPU Marquee */
    .marquee-wrap {
      overflow: hidden;
      white-space: nowrap;
      position: relative;
      mask-image: linear-gradient(to right, transparent, black 4%, black 96%, transparent);
      -webkit-mask-image: linear-gradient(to right, transparent, black 4%, black 96%, transparent);
    }
    .marquee-track {
      display: inline-flex;
      width: max-content;
      animation: marqueeTicker 34s linear infinite;
    }
    .marquee-wrap:hover .marquee-track,
    .marquee-wrap:active .marquee-track {
      animation-play-state: paused;
    }
    .marquee-track span {
      padding-right: 48px;
    }
    @keyframes marqueeTicker {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-50%, 0, 0); }
    }
  </style>
</head>
<body>

  <!-- Top Control Bar -->
  <header class="w-full max-w-[1600px] mx-auto px-3 sm:px-5 pt-2.5 pb-1.5 flex items-center justify-between gap-2 z-30 shrink-0">
    <div class="flex items-center gap-2 min-w-0">
      <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 text-white flex items-center justify-center shadow-md shrink-0">
        <i class="fa-solid fa-house-signal text-xs"></i>
      </div>
      <div class="min-w-0">
        <div class="font-black text-xs sm:text-sm truncate flex items-center gap-1.5">
          <span>Miranda &amp; Angus</span>
          <span id="cloudSyncBadge" title="雲端同步狀態" class="w-2 h-2 rounded-full bg-emerald-500 inline-block shrink-0"></span>
        </div>
        <div class="text-[10px] opacity-60 font-bold hidden sm:block">智慧家庭中控台 · Apple StandBy Bento</div>
      </div>
    </div>

    <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
      <!-- Edit Mode Toggle -->
      <button id="editModeBtn" onclick="toggleEditMode()" class="px-2.5 sm:px-3.5 py-1.5 rounded-full text-xs font-black bg-white/80 dark:bg-zinc-800/90 border border-black/10 dark:border-white/10 shadow-sm hover:scale-[1.02] active:scale-95 transition flex items-center gap-1.5">
        <i class="fa-solid fa-pen-ruler text-indigo-500"></i>
        <span id="editModeLabel">自由排版</span>
      </button>

      <!-- Quick Cloud Save Button (visible in edit mode) -->
      <button id="quickCloudSaveBtn" onclick="saveLayoutToGitHub()" class="hidden px-2.5 sm:px-3 py-1.5 rounded-full text-xs font-black bg-indigo-600 text-white shadow-sm hover:bg-indigo-700 active:scale-95 transition flex items-center gap-1">
        <i class="fa-brands fa-github"></i>
        <span>存雲端</span>
      </button>

      <!-- Control Dropdown -->
      <div class="relative">
        <button id="controlMenuBtn" onclick="toggleControlDropdown(event)" class="px-2.5 sm:px-3.5 py-1.5 rounded-full text-xs font-black bg-white/80 dark:bg-zinc-800/90 border border-black/10 dark:border-white/10 shadow-sm hover:scale-[1.02] active:scale-95 transition flex items-center gap-1.5">
          <i class="fa-solid fa-sliders text-amber-500"></i>
          <span>控制</span>
          <i class="fa-solid fa-chevron-down text-[10px] opacity-60"></i>
        </button>

        <div id="controlDropdown" class="hidden absolute right-0 mt-2 w-64 rounded-2xl bg-white/95 dark:bg-zinc-900/95 backdrop-blur-xl border border-black/10 dark:border-white/10 shadow-2xl p-2 text-xs font-bold z-50 space-y-1">
          <button onclick="openWidgetGallery(); closeAllDropdowns();" class="w-full px-3 py-2 rounded-xl text-left hover:bg-indigo-50 dark:hover:bg-zinc-800 flex items-center gap-2.5">
            <i class="fa-solid fa-grip text-emerald-500 w-4"></i>
            <span>卡片庫 / 顯示隱藏</span>
          </button>

          <button onclick="toggleAllWidgetTitles(); closeAllDropdowns();" class="w-full px-3 py-2 rounded-xl text-left hover:bg-indigo-50 dark:hover:bg-zinc-800 flex items-center justify-between gap-2">
            <span class="flex items-center gap-2.5">
              <i class="fa-solid fa-heading text-amber-500 w-4"></i>
              <span>顯示卡片標題</span>
            </span>
            <span id="globalTitleStatusTag" class="text-[10px] px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-600 dark:text-emerald-300 font-black">顯示中</span>
          </button>

          <button onclick="openCloudSyncModal(); closeAllDropdowns();" class="w-full px-3 py-2 rounded-xl text-left hover:bg-indigo-50 dark:hover:bg-zinc-800 flex items-center justify-between gap-2">
            <span class="flex items-center gap-2.5">
              <i class="fa-brands fa-github text-indigo-500 w-4"></i>
              <span>GitHub 雲端儲存排版</span>
            </span>
            <span class="text-[10px] px-1.5 py-0.5 rounded bg-indigo-500/15 text-indigo-600 dark:text-indigo-300 font-black">同步</span>
          </button>

          <button onclick="refreshAllLive(); closeAllDropdowns();" class="w-full px-3 py-2 rounded-xl text-left hover:bg-indigo-50 dark:hover:bg-zinc-800 flex items-center gap-2.5">
            <i class="fa-solid fa-rotate text-sky-500 w-4"></i>
            <span>立即刷新全部即時數據</span>
          </button>

          <div class="border-t border-black/5 dark:border-white/10 my-1"></div>

          <div class="px-3 py-1 text-[10px] uppercase tracking-wider opacity-55">外觀主題</div>
          <div class="grid grid-cols-3 gap-1 px-1 pb-1">
            <button onclick="setTheme('auto'); closeAllDropdowns();" id="themeBtnAuto" class="py-1.5 rounded-lg text-center border border-black/10 dark:border-white/10 text-[11px] font-black">自動</button>
            <button onclick="setTheme('light'); closeAllDropdowns();" id="themeBtnLight" class="py-1.5 rounded-lg text-center border border-black/10 dark:border-white/10 text-[11px] font-black">日間</button>
            <button onclick="setTheme('dark'); closeAllDropdowns();" id="themeBtnDark" class="py-1.5 rounded-lg text-center border border-black/10 dark:border-white/10 text-[11px] font-black">夜間</button>
          </div>

          <div class="border-t border-black/5 dark:border-white/10 my-1"></div>

          <div class="px-3 py-1 text-[10px] uppercase tracking-wider opacity-55">分頁管理</div>
          <div class="grid grid-cols-2 gap-1 px-1 pb-1">
            <button onclick="addNewPage(); closeAllDropdowns();" class="py-1.5 rounded-lg bg-emerald-500/10 text-emerald-600 dark:text-emerald-300 text-[11px] font-black">+ 新增分頁</button>
            <button onclick="removeCurrentPage(); closeAllDropdowns();" class="py-1.5 rounded-lg bg-rose-500/10 text-rose-600 dark:text-rose-300 text-[11px] font-black">- 刪除此頁</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Dashboard Stage -->
  <main class="flex-1 min-h-0 w-full max-w-[1600px] mx-auto px-3 sm:px-5 py-1.5 overflow-y-auto md:overflow-hidden">
    <div id="boardStage"></div>
  </main>

  <!-- Bottom Pagination Footer -->
  <footer class="w-full max-w-[1600px] mx-auto px-4 py-2 flex items-center justify-between gap-3 shrink-0 z-20">
    <button onclick="changePage(-1)" class="px-3 py-1.5 rounded-full text-xs font-black bg-white/80 dark:bg-zinc-800/90 border border-black/10 dark:border-white/10 shadow-sm hover:scale-105 active:scale-95 transition">
      ‹ 上一頁
    </button>

    <div id="pageDotsContainer" class="flex items-center gap-2"></div>

    <button onclick="changePage(1)" class="px-3 py-1.5 rounded-full text-xs font-black bg-white/80 dark:bg-zinc-800/90 border border-black/10 dark:border-white/10 shadow-sm hover:scale-105 active:scale-95 transition">
      下一頁 ›
    </button>
  </footer>

  <!-- Widget Settings Modal -->
  <div id="settingsModal" class="hidden fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="w-full max-w-md max-h-[88vh] flex flex-col rounded-3xl bg-white dark:bg-zinc-900 border border-black/10 dark:border-white/10 shadow-2xl overflow-hidden">
      <div class="px-5 py-3.5 border-b border-black/5 dark:border-white/10 flex items-center justify-between">
        <h3 id="settingsModalTitle" class="font-black text-sm flex items-center gap-2">卡片設定</h3>
        <button onclick="closeSettingsModal()" class="w-7 h-7 rounded-full bg-black/5 dark:bg-white/10 flex items-center justify-center text-xs font-black">✕</button>
      </div>
      <div id="settingsModalBody" class="p-4 overflow-y-auto transit-scroll space-y-3 text-xs"></div>
    </div>
  </div>

  <!-- Widget Gallery Modal -->
  <div id="galleryModal" class="hidden fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="w-full max-w-md max-h-[86vh] flex flex-col rounded-3xl bg-white dark:bg-zinc-900 border border-black/10 dark:border-white/10 shadow-2xl overflow-hidden">
      <div class="px-5 py-3.5 border-b border-black/5 dark:border-white/10 flex items-center justify-between">
        <h3 class="font-black text-sm">卡片庫 · 顯示或隱藏卡片</h3>
        <button onclick="closeGalleryModal()" class="w-7 h-7 rounded-full bg-black/5 dark:bg-white/10 flex items-center justify-center text-xs font-black">✕</button>
      </div>
      <div id="galleryModalBody" class="p-4 overflow-y-auto transit-scroll space-y-2 text-xs"></div>
    </div>
  </div>

  <!-- GitHub Gist Cloud Sync Modal -->
  <div id="cloudSyncModal" class="hidden fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="w-full max-w-md max-h-[88vh] flex flex-col rounded-3xl bg-white dark:bg-zinc-900 border border-black/10 dark:border-white/10 shadow-2xl overflow-hidden">
      <div class="px-5 py-3.5 border-b border-black/5 dark:border-white/10 flex items-center justify-between">
        <h3 class="font-black text-sm flex items-center gap-2"><i class="fa-brands fa-github"></i> GitHub 雲端儲存與 iPad 6 同步</h3>
        <button onclick="closeCloudModal()" class="w-7 h-7 rounded-full bg-black/5 dark:bg-white/10 flex items-center justify-center text-xs font-black">✕</button>
      </div>
      <div id="cloudSyncModalBody" class="p-4 overflow-y-auto transit-scroll space-y-3 text-xs"></div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toastBanner" class="fixed bottom-14 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-full bg-slate-900/95 dark:bg-white/95 text-white dark:text-slate-900 text-xs font-black shadow-xl pointer-events-none opacity-0 transition-opacity duration-300"></div>

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
    }

    function showToast(msg) {
      const el = document.getElementById('toastBanner');
      if (!el) return;
      el.textContent = msg;
      el.classList.remove('opacity-0');
      el.classList.add('opacity-100');
      clearTimeout(el._timer);
      el._timer = setTimeout(() => {
        el.classList.remove('opacity-100');
        el.classList.add('opacity-0');
      }, 2400);
    }

    /* Theme Management */
    function setTheme(mode) {
      state.theme = mode;
      saveState();
      const hk = getHkDateParts();
      const autoDark = hk.h24 >= 19 || hk.h24 < 6;
      const shouldDark = mode === 'dark' || (mode === 'auto' && autoDark);
      document.documentElement.classList.toggle('dark', shouldDark);

      ['auto', 'light', 'dark'].forEach(m => {
        const btn = document.getElementById('themeBtn' + m.charAt(0).toUpperCase() + m.slice(1));
        if (!btn) return;
        if (state.theme === m) {
          btn.classList.add('bg-indigo-600', 'text-white', 'border-indigo-600');
        } else {
          btn.classList.remove('bg-indigo-600', 'text-white', 'border-indigo-600');
        }
      });
    }

    /* Control Menus & Global Toggles */
    function toggleEditMode() {
      state.editMode = !state.editMode;
      saveState();
      const lbl = document.getElementById('editModeLabel');
      const saveBtn = document.getElementById('quickCloudSaveBtn');
      if (lbl) lbl.textContent = state.editMode ? '完成排版' : '自由排版';
      if (saveBtn) saveBtn.classList.toggle('hidden', !state.editMode);
      renderBoard();
      if (state.editMode) {
        showToast('拖曳卡片可移動，拖曳右下角可調整大小');

    function toggleControlDropdown(e) {
      if (e) e.stopPropagation();

    function closeAllDropdowns() {
      document.getElementById('controlDropdown')?.classList.add('hidden');

      const dd = document.getElementById('controlDropdown');
      const btn = document.getElementById('controlMenuBtn');
      if (dd && !dd.contains(e.target) && btn && !btn.contains(e.target)) {
        dd.classList.add('hidden');

      state.hideAllTitles = !Boolean(state.hideAllTitles);

      updateGlobalTitleTagUI();
      renderBoard();
      showToast(state.hideAllTitles ? '已隱藏全部卡片標題' : '已顯示卡片標題');

      const tag = document.getElementById('globalTitleStatusTag');
      if (!tag) return;

        tag.textContent = '已隱藏';
        tag.className = 'text-[10px] px-1.5 py-0.5 rounded bg-slate-500/20 text-slate-600 dark:text-slate-300 font-black';
      } else {
        tag.textContent = '顯示中';
        tag.className = 'text-[10px] px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-600 dark:text-emerald-300 font-black';
      }

    /* Pagination */
    function changePage(delta) {
      let next = state.currentPage + delta;
      if (next < 1) next = state.totalPages;
      if (next > state.totalPages) next = 1;
      state.currentPage = next;
      saveState();
      renderBoard();
    }

    function goToPage(p) {
      state.currentPage = p;
      saveState();
      renderBoard();
    }

    function addNewPage() {
      if (state.totalPages >= 6) {
        showToast('最多支援 6 個分頁');
        return;
      }
      state.totalPages += 1;
      state.currentPage = state.totalPages;
      saveState();
      renderBoard();
      showToast(`✓ 已新增第 ${state.totalPages} 頁`);
    }

    function removeCurrentPage() {
      if (state.totalPages <= 1) {
        showToast('最少保留 1 個分頁');
        return;
      }
      const target = state.currentPage;
      state.widgets.forEach(w => {
        if (w.page === target) w.page = 1;
        else if (w.page > target) w.page -= 1;
      });
      state.totalPages -= 1;
      state.currentPage = Math.max(1, target - 1);
      saveState();
      renderBoard();
      showToast(`已刪除分頁，卡片已移至第 1 頁`);
    }

    /* Timezone & Live Clock Helpers */
    function getTimePartsInZone(tz) {
      const now = new Date();
      const fmt = new Intl.DateTimeFormat('en-US', {
        timeZone: tz,
        year: 'numeric',
        month: 'numeric',
        day: 'numeric',
        hour: 'numeric',
        minute: '2-digit',
        second: '2-digit',
        hour12: false,
        weekday: 'short'
      });
      const parts = fmt.formatToParts(now);
      const getVal = (type) => parts.find(p => p.type === type)?.value || '';
      const year = Number(getVal('year'));
      const month = Number(getVal('month'));
      const day = Number(getVal('day'));
      let h24 = Number(getVal('hour'));
      if (h24 === 24) h24 = 0;
      const m = getVal('minute').padStart(2, '0');
      const s = getVal('second').padStart(2, '0');
      const ampm = h24 >= 12 ? 'PM' : 'AM';
      const h12Num = h24 % 12 === 0 ? 12 : h24 % 12;
      const h12 = String(h12Num).padStart(2, '0');
      const wdMap = { Sun: '星期日', Mon: '星期一', Tue: '星期二', Wed: '星期三', Thu: '星期四', Fri: '星期五', Sat: '星期六' };
      const weekdayZh = wdMap[getVal('weekday')] || '星期五';
      const dayProgress = Math.min(100, Math.max(1, Math.round(((h24 * 60 + Number(m)) / 1440) * 100)));
      return { year, month, day, h24, h12, m, s, ampm, weekdayZh, dayProgress };
    }

    function getHkDateParts() {
      return getTimePartsInZone('Asia/Hong_Kong');
    }

    function updateClockDOM() {
      const hk = getHkDateParts();
      const timeEl = document.getElementById('heroClockTime');
      const ampmEl = document.getElementById('heroClockAmPm');

      const barEl = document.getElementById('heroDayProgressBar');
      const pctEl = document.getElementById('heroDayProgressPct');
      if (timeEl) timeEl.textContent = `${hk.h12}:${hk.m}`;
      if (ampmEl) ampmEl.textContent = hk.ampm;
      if (secEl) secEl.textContent = hk.s;
      if (barEl) barEl.style.width = `${hk.dayProgress}%`;
      if (pctEl) pctEl.textContent = `今日進度 ${hk.dayProgress}%`;

      const city = WORLD_CITIES[state.worldCity] || WORLD_CITIES.vancouver;
      const wc = getTimePartsInZone(city.tz);

      const wAmPmEl = document.getElementById('heroWorldAmPm');
      if (wTimeEl) wTimeEl.textContent = `${wc.h12}:${wc.m}`;
      if (wAmPmEl) wAmPmEl.textContent = wc.ampm;
    }

    /* Sky & Weather Animation Helpers */
    function getSkyThemeInfo(isNight, isSunset, iconClass) {
      const ic = String(iconClass || '');
      const isStorm = ic.includes('bolt');
      const isRain = !isStorm && (ic.includes('rain') || ic.includes('showers'));
      const isCloudy = ic === 'fa-cloud' || ic === 'fa-cloud-sun';

      let themeClass = 'sky-clear-day';
      if (isStorm) themeClass = 'sky-storm';
      else if (isRain) themeClass = 'sky-rain';
      else if (isNight) themeClass = isCloudy ? 'sky-cloudy-night' : 'sky-clear-night';
      else if (isSunset) themeClass = 'sky-sunset';
      else if (isCloudy) themeClass = 'sky-cloudy-day';

      return { themeClass, isNight, isRain, isStorm, isCloudy };
    }

    function buildSkyAnimHtml(sky) {
      const parts = ['<div class="sky-anim-layer">'];

      if (sky.isNight) {
        parts.push('<div class="sky-moon-orb"></div>');
        const starCoords = [
          [14, 18, 0.2], [28, 34, 1.1], [46, 15, 0.7], [62, 28, 1.8],
          [78, 14, 0.5], [84, 42, 1.4], [22, 58, 0.9], [54, 48, 2.1], [72, 62, 0.3]
        ];
        starCoords.forEach(([x, y, delay]) => {
          parts.push(`<div class="sky-star" style="left:${x}%; top:${y}%; animation-delay:${delay}s;"></div>`);
        });
        if (!sky.isRain && !sky.isStorm) {
          parts.push('<div class="sky-shooting-star"></div>');
        }
      } else if (!sky.isRain && !sky.isStorm) {
        parts.push('<div class="sky-sun-orb"></div>');
      }

      const cloudClass = sky.isNight ? 'sky-cloud night-cloud' : 'sky-cloud';
      parts.push(`<div class="${cloudClass} sky-cloud-1"></div>`);
      parts.push(`<div class="${cloudClass} sky-cloud-2"></div>`);
      if (sky.isCloudy || sky.isRain || sky.isStorm) {
        parts.push(`<div class="${cloudClass} sky-cloud-3"></div>`);
      }

      if (sky.isRain || sky.isStorm) {
        const drops = [8, 18, 28, 38, 48, 58, 68, 78, 88, 94];
        drops.forEach((leftPct, idx) => {
          const delay = ((idx * 0.17) % 1).toFixed(2);
          parts.push(`<div class="sky-raindrop" style="left:${leftPct}%; animation-delay:${delay}s;"></div>`);
        });
      }

      if (sky.isStorm) {
        parts.push('<div class="sky-lightning-flash"></div>');
      }

      parts.push('</div>');
      return parts.join('');
    }

    /* Flight Info Helpers */
    function resolveFlightInfo(rawCode) {
      const code = String(rawCode || '').trim().toUpperCase().replace(/\s+/g, '');
      if (KNOWN_FLIGHT_ROUTES[code]) {
        return Object.assign({ code }, KNOWN_FLIGHT_ROUTES[code]);
      }
      const prefix = code.slice(0, 2);
      const airline = AIRLINE_PREFIX_MAP[prefix] || `${prefix} 航空`;
      const numPart = parseInt(code.replace(/\D/g, ''), 10) || 100;
      const isOutbound = numPart % 2 === 0;
      return {
        code,
        airline,
        fromCode: isOutbound ? 'HKG' : 'NRT',
        fromCity: isOutbound ? '香港' : '目的地機場',
        toCode: isOutbound ? 'DEST' : 'HKG',
        toCity: isOutbound ? '目的地機場' : '香港',
        terminal: 'T1',
        gate: String((numPart % 65) + 10),
        checkin: 'B 行段',
        baggage: `轉盤 ${(numPart % 10) + 1}`,
        aircraft: 'A350-900',
        durationMins: 320
      };
    }

    function normalizeFlightItem(fl) {
      const base = resolveFlightInfo(fl.flightNumber || 'CX888');
      return {
        id: fl.id || 'fl_' + Date.now(),
        flightNumber: base.code,
        emoji: fl.emoji || '👵🏻',
        airline: fl.airline || base.airline,
        fromCode: fl.fromCode || base.fromCode,
        fromCity: fl.fromCity || base.fromCity,
        toCode: fl.toCode || base.toCode,
        toCity: fl.toCity || base.toCity,
        terminal: fl.terminal || base.terminal,
        gate: fl.gate || base.gate,
        checkin: fl.checkin || base.checkin,
        baggage: fl.baggage || base.baggage,
        aircraft: fl.aircraft || base.aircraft,
        durationMins: Number(fl.durationMins) || base.durationMins,
        progress: typeof fl.progress === 'number' ? fl.progress : 50
      };
    }

    function formatRemainingFlightTime(durationMins, progress) {
      const total = Number(durationMins) || 300;
      const pct = Math.max(0, Math.min(100, Number(progress) || 0));
      if (pct >= 100) return '已抵達目的地';
      const remMins = Math.max(5, Math.round(total * ((100 - pct) / 100)));
      const hrs = Math.floor(remMins / 60);
      const mins = remMins % 60;
      return hrs > 0 ? `預計剩餘 ${hrs}h ${mins}m` : `預計剩餘 ${mins}m`;
    }

    /* Main Board Renderer */
    function renderBoard() {
      const stage = document.getElementById('boardStage');
      if (!stage) return;
      stage.innerHTML = '';

      const isMobile = window.innerWidth < 768;
      const pageWidgets = state.widgets.filter(w => w.visible !== false && w.page === state.currentPage);
      const hk = getHkDateParts();
      const hkIsNight = hk.h24 >= 19 || hk.h24 < 6;
      const hkIsSunset = hk.h24 >= 17 && hk.h24 < 19;

      pageWidgets.forEach(w => {
        const card = document.createElement('div');
        card.className = 'bento-card' + (state.editMode ? ' edit-mode' : '');
        card.dataset.id = w.id;

        const scale = Number(w.fontScale) || 1;
        card.style.fontSize = `${Math.round(scale * 100)}%`;

        let skyLayerHtml = '';
        if (w.id === 'clock' || w.id === 'weather') {
          const sky = getSkyThemeInfo(hkIsNight, hkIsSunset, liveData.hkWeather.icon);
          card.classList.add(sky.themeClass);
          skyLayerHtml = buildSkyAnimHtml(sky);
        } else if (w.id === 'worldClock') {
          const city = WORLD_CITIES[state.worldCity] || WORLD_CITIES.vancouver;
          const wc = getTimePartsInZone(city.tz);
          const wcIsNight = wc.h24 >= 19 || wc.h24 < 6;
          const wcIsSunset = wc.h24 >= 17 && wc.h24 < 19;
          const sky = getSkyThemeInfo(wcIsNight, wcIsSunset, liveData.worldWeather.icon);
          card.classList.add(sky.themeClass);
          skyLayerHtml = buildSkyAnimHtml(sky);
        } else if (w.id === 'message') {
          if (state.messageBgColor) card.style.background = state.messageBgColor;
          if (state.messageTextColor) card.style.color = state.messageTextColor;
        }

        if (isMobile) {
          const cSpan = Math.max(1, Math.min(2, Number(w.mobColSpan) || 2));
          const rSpan = Math.max(2, Math.min(8, Number(w.mobRowSpan) || 3));
          card.style.gridColumn = `span ${cSpan}`;
          card.style.gridRow = `span ${rSpan}`;
        } else {
          const x = Math.max(1, Math.min(12, Number(w.x) || 1));
          const y = Math.max(1, Math.min(12, Number(w.y) || 1));
          const gw = Math.max(2, Math.min(12 - x + 1, Number(w.w) || 4));
          const gh = Math.max(2, Math.min(12 - y + 1, Number(w.h) || 4));
          card.style.gridColumn = `${x} / span ${gw}`;
          card.style.gridRow = `${y} / span ${gh}`;
        }

        let editOverlay = '';
        if (state.editMode) {
          editOverlay = `
            <div class="absolute top-1.5 left-2 right-2 z-30 flex items-center justify-between gap-1 pointer-events-auto">
              <span class="px-2 py-0.5 rounded-full bg-indigo-600 text-white text-[10px] font-black truncate">${w.title}</span>
              <button type="button" onclick="openWidgetSettings('${w.id}')" class="w-6 h-6 rounded-full bg-white dark:bg-zinc-800 text-slate-900 dark:text-white shadow border border-black/10 flex items-center justify-center text-[11px]">
                <i class="fa-solid fa-gear"></i>
              </button>
            </div>
            <div class="resize-handle absolute bottom-1 right-1 w-6 h-6 rounded-full bg-indigo-600/90 text-white flex items-center justify-center text-[10px] cursor-nwse-resize z-30 shadow">
              <i class="fa-solid fa-up-right-and-down-left-from-center rotate-90"></i>
            </div>
          `;
        }

        card.innerHTML = `${skyLayerHtml}${editOverlay}${renderWidgetContent(w)}`;
        stage.appendChild(card);

        if (state.editMode) {
          const resizeHandle = card.querySelector('.resize-handle');
          initCardInteractions(card, resizeHandle, w, isMobile);
        }
      });

      renderPageDots();
    }

    function renderPageDots() {
      const container = document.getElementById('pageDotsContainer');
      if (!container) return;
      let html = '';
      for (let p = 1; p <= state.totalPages; p++) {
        const active = p === state.currentPage;
        html += `
          <button onclick="goToPage(${p})" class="h-2.5 rounded-full transition-all ${active ? 'w-7 bg-indigo-600' : 'w-2.5 bg-slate-400/50 hover:bg-slate-400'}" aria-label="第 ${p} 頁"></button>
        `;
      }
      container.innerHTML = html;
    }

    function initCardInteractions(card, resizeHandle, w, isMobile) {
      const stage = document.getElementById('boardStage');
      if (!stage) return;

      if (resizeHandle) {
        resizeHandle.addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          e.preventDefault();
          const startX = e.clientX;
          const startY = e.clientY;
          const rect = stage.getBoundingClientRect();
          const colUnit = rect.width / (isMobile ? 2 : 12);
          const rowUnit = isMobile ? 56 : (rect.height / 12);
          const origW = isMobile ? (w.mobColSpan || 2) : (w.w || 4);
          const origH = isMobile ? (w.mobRowSpan || 3) : (w.h || 4);

          const onMove = (ev) => {
            const dx = Math.round((ev.clientX - startX) / colUnit);
            const dy = Math.round((ev.clientY - startY) / rowUnit);
            if (isMobile) {
              w.mobColSpan = Math.max(1, Math.min(2, origW + dx));
              w.mobRowSpan = Math.max(2, Math.min(8, origH + dy));
              card.style.gridColumn = `span ${w.mobColSpan}`;
              card.style.gridRow = `span ${w.mobRowSpan}`;
            } else {
              w.w = Math.max(2, Math.min(12 - (w.x || 1) + 1, origW + dx));
              w.h = Math.max(2, Math.min(12 - (w.y || 1) + 1, origH + dy));
              card.style.gridColumn = `${w.x} / span ${w.w}`;
              card.style.gridRow = `${w.y} / span ${w.h}`;
            }
          };

          const onUp = () => {
            window.removeEventListener('pointermove', onMove);
            window.removeEventListener('pointerup', onUp);
            saveState();
            renderBoard();
          };

          window.addEventListener('pointermove', onMove);
          window.addEventListener('pointerup', onUp);
        });
      }

      card.addEventListener('pointerdown', (e) => {
        if (e.target.closest('button, input, select, a, .resize-handle')) return;
        const startX = e.clientX;
        const startY = e.clientY;
        const rect = stage.getBoundingClientRect();
        const colUnit = rect.width / (isMobile ? 2 : 12);
        const rowUnit = isMobile ? 56 : (rect.height / 12);
        const origX = w.x || 1;
        const origY = w.y || 1;

        const onMove = (ev) => {
          if (isMobile) return;
          const dx = Math.round((ev.clientX - startX) / colUnit);
          const dy = Math.round((ev.clientY - startY) / rowUnit);
          w.x = Math.max(1, Math.min(12 - (w.w || 4) + 1, origX + dx));
          w.y = Math.max(1, Math.min(12 - (w.h || 4) + 1, origY + dy));
          card.style.gridColumn = `${w.x} / span ${w.w}`;
          card.style.gridRow = `${w.y} / span ${w.h}`;
        };

        const onUp = (ev) => {
          window.removeEventListener('pointermove', onMove);
          window.removeEventListener('pointerup', onUp);
          if (isMobile && Math.abs(ev.clientY - startY) > 35) {
            const dir = ev.clientY > startY ? 1 : -1;
            const pageList = state.widgets.filter(item => item.page === state.currentPage && item.visible !== false);
            const curIdx = pageList.findIndex(item => item.id === w.id);
            const targetIdx = curIdx + dir;
            if (curIdx >= 0 && targetIdx >= 0 && targetIdx < pageList.length) {
              const allIdxA = state.widgets.findIndex(item => item.id === pageList[curIdx].id);
              const allIdxB = state.widgets.findIndex(item => item.id === pageList[targetIdx].id);
              const tmp = state.widgets[allIdxA];
              state.widgets[allIdxA] = state.widgets[allIdxB];
              state.widgets[allIdxB] = tmp;
            }
          }
          saveState();
          renderBoard();
        };

        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp);
      });
    }

        const uvPillsHtml = uvColors.map((cls, idx) =>
          `<span class="w-3.5 h-1.5 rounded-full ${cls} ${idx < activeUvLevel ? 'opacity-100' : 'opacity-30'}"></span>`
        ).join('');

        const fList = wx.forecast || [];
        const highs = fList.map(f => f.high);
        const maxT = Math.max(...highs);
        const minT = Math.min(...highs);
        const range = Math.max(1, maxT - minT);

        const svgW = 500;
        const svgH = 92;
        const getCurveY = (highVal) => 22 + ((maxT - highVal) / range) * 46;

        const pts = fList.map((f, i) => {
          const xPct = (i + 0.5) * 20;
          return {
            xPct,
            x: xPct * 5,
            y: getCurveY(f.high),
            high: f.high,
            low: f.low
          };
        });

        let smoothPath = '';
        if (pts.length > 0) {
          smoothPath = `M ${pts[0].x.toFixed(1)},${pts[0].y.toFixed(1)}`;
          const tension = 0.25;
          for (let i = 0; i < pts.length - 1; i++) {
            const p0 = pts[Math.max(0, i - 1)];
            const p1 = pts[i];
            const p2 = pts[i + 1];
            const p3 = pts[Math.min(pts.length - 1, i + 2)];
            const cp1x = p1.x + (p2.x - p0.x) * tension;
            const cp1y = p1.y + (p2.y - p0.y) * tension;
            const cp2x = p2.x - (p3.x - p1.x) * tension;
            const cp2y = p2.y - (p3.y - p1.y) * tension;
            smoothPath += ` C ${cp1x.toFixed(1)},${cp1y.toFixed(1)} ${cp2x.toFixed(1)},${cp2y.toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`;
          }
        }

        const getForecastIconStyle = (ic) => {
          if (ic === 'fa-sun') return 'text-amber-300';
          if (ic === 'fa-cloud-sun') return 'text-amber-200';
          if (ic.includes('rain') || ic.includes('showers')) return 'text-sky-200';
          return 'text-white/90';
        };

        return `
          <div class="flex flex-col justify-between h-full min-h-0">
            <div class="flex items-start justify-between gap-2 shrink-0">
              <div class="flex items-center gap-2 min-w-0">
                <span class="hero-temp-num tabular-nums shrink-0">${wx.temp}°</span>
                <div class="min-w-0">
                  <div class="flex items-center gap-1">
                    <select onchange="changeWeatherDistrict(this.value)" class="bg-transparent font-black fs-md outline-none cursor-pointer">
                      ${distOptions}
                    </select>
                    <i class="fa-solid fa-location-arrow fs-2xs opacity-80"></i>
                    <span class="fs-xs font-bold opacity-85 ml-1">${wx.high}°/${wx.low}°</span>
                  </div>
                  <div class="fs-2xs font-bold opacity-95 truncate">${wx.summary || wx.condition}</div>
                  <div class="flex items-center gap-1.5 mt-0.5 fs-2xs font-black">
                    <span class="flex items-center gap-1 opacity-95"><i class="fa-solid fa-sun text-amber-300"></i>紫外線 ${uvVal}</span>
                    <span class="flex items-center gap-1">${uvPillsHtml}</span>
                  </div>
                </div>
              </div>
              <i class="fa-solid ${wx.icon} text-amber-300 fs-xl sm:fs-2xl wx-icon-float shrink-0"></i>
            </div>

            <div class="mt-auto pt-1.5 flex flex-col justify-end shrink-0">
              <div class="grid grid-cols-5 text-center shrink-0 mb-1">
                ${fList.map(f => `
                  <div class="flex flex-col items-center gap-0.5">
                    <span class="fs-2xs font-black tracking-tight opacity-95">${f.dateNum ? `${f.dateNum} (${f.day})` : `(${f.day})`}</span>
                    <i class="fa-solid ${f.icon} ${getForecastIconStyle(f.icon)} fs-sm sm:fs-md drop-shadow-sm"></i>
                  </div>
                `).join('')}
              </div>

              <div class="relative w-full h-[92px] shrink-0">
                <svg viewBox="0 0 ${svgW} ${svgH}" preserveAspectRatio="none" class="absolute inset-0 w-full h-full overflow-visible">
                  <defs>
                    <linearGradient id="wxSmoothGrad_${w.id}" x1="0%" y1="0%" x2="100%" y2="0%">
                      <stop offset="0%" stop-color="#fb923c" />
                      <stop offset="28%" stop-color="#facc15" />
                      <stop offset="55%" stop-color="#4ade80" />
                      <stop offset="80%" stop-color="#22d3ee" />
                      <stop offset="100%" stop-color="#38bdf8" />
                    </linearGradient>
                  </defs>

                  <path d="${smoothPath}" fill="none" stroke="url(#wxSmoothGrad_${w.id})" stroke-width="10" stroke-opacity="0.34" stroke-linecap="round" vector-effect="non-scaling-stroke" />
                  <path d="${smoothPath}" fill="none" stroke="url(#wxSmoothGrad_${w.id})" stroke-width="4" stroke-linecap="round" vector-effect="non-scaling-stroke" />
                </svg>

                ${pts.map(p => `
                  <div style="left:${p.xPct}%; top:${p.y.toFixed(1)}px;" class="absolute -translate-x-1/2 -translate-y-1/2 pointer-events-none">
                    <span class="absolute bottom-full mb-1 left-1/2 -translate-x-1/2 text-[11px] font-black text-white whitespace-nowrap drop-shadow-sm">${p.high}°C</span>
                    <div class="w-3 h-3 rounded-full bg-white/30 flex items-center justify-center">
                      <div class="w-2 h-2 rounded-full bg-white shadow"></div>
                    </div>
                    <span class="absolute top-full mt-1 left-1/2 -translate-x-1/2 text-[10.5px] font-extrabold text-slate-100 whitespace-nowrap drop-shadow-sm">${p.low}°C</span>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        `;
      } else if (w.id === 'worldClock') {
        const city = WORLD_CITIES[state.worldCity] || WORLD_CITIES.vancouver;
        const wc = getTimePartsInZone(city.tz);
        const hk = getHkDateParts();
        const dayDiff = wc.day - hk.day;
        const dayLabel = dayDiff === 0 ? '今日' : dayDiff < 0 ? '昨日' : '明日';
        const cityOpts = Object.entries(WORLD_CITIES).map(([k, v]) =>
          `<option value="${k}" ${k === state.worldCity ? 'selected' : ''} class="text-slate-900">${v.name}</option>`
        ).join('');

        return `
          <div class="flex flex-col justify-between h-full min-h-0">
            <div class="flex items-start justify-between gap-1">
              <div class="min-w-0">
                <select onchange="changeWorldCity(this.value)" class="bg-transparent font-black fs-md outline-none cursor-pointer truncate max-w-full">
                  ${cityOpts}
                </select>
                <div class="fs-2xs opacity-85 font-bold truncate">${dayLabel} · ${city.region}</div>
              </div>
              <div class="flex items-center gap-1 fs-xs font-black bg-white/15 px-2 py-0.5 rounded-full shrink-0">
                <i class="fa-solid ${liveData.worldWeather.icon} text-amber-300"></i>
                <span>${liveData.worldWeather.temp}°</span>
              </div>
            </div>

            <div class="my-auto pt-0.5">
              <div class="flex items-baseline gap-1.5">
                <span id="heroWorldTime" class="hero-world-num tabular-nums">${wc.h12}:${wc.m}</span>
                <span id="heroWorldAmPm" class="fs-xs font-black opacity-85">${wc.ampm}</span>
              </div>
              <div class="fs-2xs opacity-85 font-bold mt-0.5 truncate">${wc.month}月${wc.day}日 ${wc.weekdayZh} · ${liveData.worldWeather.condition}</div>
            </div>
          </div>
        `;
      } else if (w.id === 'transit') {
        return `
          <div class="flex flex-col h-full min-h-0">
            ${showTitle ? `
              <div class="flex items-center justify-between gap-1 mb-1 shrink-0">
                <div class="flex items-center gap-1.5 font-black fs-sm truncate">
                  <i class="fa-solid fa-train-subway text-indigo-500"></i>
                  <span class="truncate">${w.title}</span>
                </div>
                <button onclick="fetchTransit()" title="刷新到站時間" class="w-6 h-6 rounded-full bg-black/5 dark:bg-white/10 flex items-center justify-center fs-2xs opacity-75 hover:opacity-100 shrink-0">
                  <i class="fa-solid fa-rotate"></i>
                </button>
              </div>
            ` : ''}

            <div class="flex-1 min-h-0 overflow-y-auto transit-scroll space-y-1.5 pr-0.5">
              ${state.transitItems.map(item => {
                const eta = liveData.transitEta[item.id] !== undefined ? liveData.transitEta[item.id] : ((Number(item.walkMins) || 5) + 3);
                const walk = Number(item.walkMins) || 5;
                const diff = eta - walk;
                const advice = diff < 0 ? '剛開出' : diff <= 2 ? '準備出門' : `步行 ${walk} 分`;
                const badgeBg = diff < 0 ? 'bg-slate-500' : diff <= 2 ? 'bg-rose-500' : 'bg-emerald-600';

                return `
                  <div class="p-1.5 sm:p-2 rounded-2xl bg-black/[0.04] dark:bg-white/[0.06] flex items-center justify-between gap-1.5">
                    <div class="min-w-0">
                      <div class="flex items-center gap-1">
                        <span class="px-1.5 py-0.5 rounded-full text-white font-black fs-2xs shrink-0" style="background:${item.color || '#4f46e5'}">${item.label}</span>
                        <span class="fs-2xs opacity-65 font-bold truncate">${advice}</span>
                      </div>
                      <div class="fs-2xs sm:fs-xs font-bold opacity-80 truncate mt-0.5">${item.sub}</div>
                    </div>
                    <div class="px-2 py-0.5 rounded-full text-white font-black fs-xs tabular-nums shrink-0 ${badgeBg}">
                      ${eta} 分
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      } else if (w.id === 'todo') {
        const dueFilter = state.todoFilterDue || 'today';
        const sevFilter = state.todoFilterSeverity || 'all';
        const ownerFilter = state.todoFilterOwner || 'all';

        const sevOptions = Array.from(new Set(
          state.todos.map(t => String(t.severity || '').trim()).filter(Boolean)
        ));
        if (sevOptions.length === 0) sevOptions.push('🔴', '🟡', '🟢');

        const ownerSet = new Set(['Miranda', 'Angus', '共同']);
        state.todos.forEach(t => {
          String(t.owner || '').split(/[,，/&、]+/).map(s => s.trim()).filter(Boolean).forEach(o => ownerSet.add(o));
        });
        const ownerOptions = Array.from(ownerSet);

        const filtered = state.todos
          .filter(t => {
            if (dueFilter === 'today' && !t.isToday) return false;
            if (dueFilter === 'week' && !t.isThisWeek && !t.isToday) return false;
            if (sevFilter !== 'all' && String(t.severity || '').trim() !== sevFilter) return false;
            if (ownerFilter !== 'all') {
              const owners = String(t.owner || '').split(/[,，/&、]+/).map(s => s.trim()).filter(Boolean);
              if (!owners.includes(ownerFilter)) return false;
            }
            return true;
          })
          .sort((a, b) => (Number(a.done) - Number(b.done)) || ((a.sevRank || 2) - (b.sevRank || 2)));

        return `
          <div class="flex flex-col h-full min-h-0">
            <div class="flex items-center justify-between gap-1.5 mb-1.5 shrink-0 flex-wrap">
              ${showTitle ? `
                <div class="flex items-center gap-1.5 font-black fs-sm">
                  <i class="fa-solid fa-list-check text-emerald-500"></i>
                  <span>${w.title}</span>
                </div>
              ` : ''}
              <div class="flex items-center gap-1 ml-auto flex-wrap">
                <select onchange="setTodoFilter('due', this.value)" class="px-2 py-1 rounded-full fs-2xs font-black bg-indigo-600 text-white outline-none cursor-pointer">
                  <option value="today" ${dueFilter === 'today' ? 'selected' : ''} class="text-slate-900 bg-white">📅 今日</option>
                  <option value="week" ${dueFilter === 'week' ? 'selected' : ''} class="text-slate-900 bg-white">📅 今個星期</option>
                  <option value="all" ${dueFilter === 'all' ? 'selected' : ''} class="text-slate-900 bg-white">📅 全部</option>
                </select>
                <select onchange="setTodoFilter('sev', this.value)" class="px-2 py-1 rounded-full fs-2xs font-black bg-black/5 dark:bg-white/10 outline-none cursor-pointer">
                  <option value="all" ${sevFilter === 'all' ? 'selected' : ''} class="text-slate-900 bg-white">程度：全部</option>
                  ${sevOptions.map(s => `<option value="${s}" ${sevFilter === s ? 'selected' : ''} class="text-slate-900 bg-white">${s}</option>`).join('')}
                </select>
                <select onchange="setTodoFilter('owner', this.value)" class="px-2 py-1 rounded-full fs-2xs font-black bg-black/5 dark:bg-white/10 outline-none cursor-pointer">
                  <option value="all" ${ownerFilter === 'all' ? 'selected' : ''} class="text-slate-900 bg-white">👤 負責人：全部</option>
                  ${ownerOptions.map(o => `<option value="${o}" ${ownerFilter === o ? 'selected' : ''} class="text-slate-900 bg-white">👤 ${o}</option>`).join('')}
                </select>
                <button onclick="syncGoogleSheetTodos(false)" title="同步 Google Sheet" class="w-6 h-6 rounded-full bg-emerald-500/15 text-emerald-600 dark:text-emerald-300 flex items-center justify-center fs-2xs shrink-0">
                  <i class="fa-solid fa-rotate"></i>
                </button>
              </div>
            </div>

            <div class="flex-1 min-h-0 overflow-y-auto transit-scroll space-y-1.5 pr-0.5">
              ${filtered.length > 0 ? filtered.map(t => `
                <div onclick="toggleTodoDone('${t.id}')" class="p-2 rounded-xl bg-black/[0.03] dark:bg-white/[0.05] hover:bg-black/[0.06] flex items-center justify-between gap-2 cursor-pointer transition ${t.done ? 'opacity-45 line-through' : ''}">
                  <div class="flex items-center gap-2 min-w-0">
                    <i class="fa-${t.done ? 'solid fa-circle-check text-emerald-500' : 'regular fa-circle opacity-45'} shrink-0"></i>
                    <span class="fs-xs font-bold truncate">${t.text}</span>
                  </div>
                  <span class="fs-sm leading-none shrink-0">${t.severity || ''}</span>
                </div>
              `).join('') : `<div class="h-full flex items-center justify-center opacity-50 fs-xs font-bold">目前篩選條件下沒有待辦事項</div>`}
            </div>

            <div class="mt-1.5 pt-1.5 border-t border-black/5 dark:border-white/10 flex items-center gap-1.5 shrink-0">
              <input id="quickTodoInput" type="text" placeholder="快速新增任務..." onkeydown="if(event.key==='Enter') addNewTodo()" class="flex-1 min-w-0 px-2.5 py-1 rounded-xl bg-black/5 dark:bg-white/10 fs-xs font-bold outline-none" />
              <select id="quickTodoSev" class="px-2 py-1 rounded-xl bg-black/5 dark:bg-white/10 fs-xs font-black outline-none">
                ${sevOptions.map((s, i) => `<option value="${s}" ${i === 0 ? 'selected' : ''}>${s}</option>`).join('')}
              </select>
              <button onclick="addNewTodo()" class="px-2.5 py-1 rounded-xl bg-emerald-600 text-white fs-xs font-black shrink-0">+</button>
            </div>
          </div>
        `;
      } else if (w.id === 'calendar') {
        const sortedEvents = [...state.calendarEvents].sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
        return `
          <div class="flex flex-col h-full min-h-0">
            ${showTitle ? `
              <div class="flex items-center justify-between gap-1 mb-1.5 shrink-0">
                <div class="flex items-center gap-1.5 font-black fs-sm">
                  <i class="fa-solid fa-calendar-days text-rose-500"></i>
                  <span>${w.title}</span>
                </div>
                <button onclick="openWidgetSettings('calendar')" class="px-2 py-0.5 rounded-full bg-rose-500/15 text-rose-600 dark:text-rose-300 fs-2xs font-black">+ 行程</button>
              </div>
            ` : ''}

            <div class="flex-1 min-h-0 overflow-y-auto transit-scroll space-y-1.5 pr-0.5">
              ${sortedEvents.map(ev => {
                const ownerTag = ev.owner === 'Miranda'
                  ? '<span class="px-1.5 py-0.5 rounded bg-pink-500/15 text-pink-600 dark:text-pink-300 fs-2xs font-black">Miranda</span>'
                  : ev.owner === 'Angus'
                  ? '<span class="px-1.5 py-0.5 rounded bg-sky-500/15 text-sky-600 dark:text-sky-300 fs-2xs font-black">Angus</span>'
                  : '<span class="px-1.5 py-0.5 rounded bg-purple-500/15 text-purple-600 dark:text-purple-300 fs-2xs font-black">共同</span>';
                return `
                  <div class="p-2 rounded-xl bg-black/[0.03] dark:bg-white/[0.05] flex items-center justify-between gap-2">
                    <div class="min-w-0">
                      <div class="fs-xs font-black truncate">${ev.title}</div>
                      <div class="fs-2xs opacity-65 font-bold">${ev.date.slice(5)} · ${ev.time}</div>
                    </div>
                    ${ownerTag}
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      } else if (w.id === 'message') {
        const msgFontPx = Number(state.messageFontSize) || 20;
        const hasCustomBg = Boolean(state.messageBgColor);
        const bubbleClass = hasCustomBg
          ? 'p-2.5 rounded-xl bg-black/[0.07] border border-current/15'
          : 'p-2.5 rounded-xl bg-amber-500/10 border border-amber-500/15';
        const inputClass = hasCustomBg
          ? 'flex-1 min-w-0 px-2.5 py-1 rounded-xl bg-black/10 border border-current/15 fs-xs font-bold outline-none placeholder:opacity-60'
          : 'flex-1 min-w-0 px-2.5 py-1 rounded-xl bg-black/5 dark:bg-white/10 fs-xs font-bold outline-none';

        return `
          <div class="flex flex-col h-full min-h-0">
            <div class="flex items-center justify-between gap-1 mb-1.5 shrink-0">
              ${showTitle ? `
                <div class="flex items-center gap-1.5 font-black fs-sm">
                  <i class="fa-solid fa-comment-dots ${hasCustomBg ? '' : 'text-amber-500'}"></i>
                  <span>${w.title}</span>
                </div>
              ` : ''}
              <div class="flex items-center gap-1 ml-auto">
                <button onclick="syncGoogleSheetMessages(false)" title="同步 Google Sheet 留言" class="w-6 h-6 rounded-full ${hasCustomBg ? 'bg-black/10' : 'bg-amber-500/15 text-amber-600 dark:text-amber-300'} flex items-center justify-center fs-2xs">
                  <i class="fa-solid fa-rotate"></i>
                </button>
                <button onclick="openWidgetSettings('message')" class="px-2 py-0.5 rounded-full ${hasCustomBg ? 'bg-black/10' : 'bg-black/5 dark:bg-white/10'} fs-2xs font-black">⚙️ 設定</button>
              </div>
            </div>

            <div class="flex-1 min-h-0 overflow-y-auto transit-scroll space-y-2 pr-0.5">
              ${state.messages.length > 0 ? state.messages.map(m => `
                <div class="${bubbleClass}">
                  ${(m.author || m.time) ? `
                    <div class="flex items-center justify-between fs-2xs opacity-70 font-bold mb-0.5">
                      <span>${m.author || ''}</span>
                      <span>${m.time || ''}</span>
                    </div>
                  ` : ''}
                  <div style="font-size:${msgFontPx}px;" class="font-extrabold leading-snug break-words">${m.text}</div>
                </div>
              `).join('') : `<div class="h-full flex items-center justify-center opacity-50 fs-xs font-bold">暫無家庭留言</div>`}
            </div>

            <div class="mt-1.5 pt-1.5 border-t ${hasCustomBg ? 'border-current/15' : 'border-black/5 dark:border-white/10'} flex items-center gap-1.5 shrink-0">
              <input id="quickMsgInput" type="text" placeholder="寫低留言畀屋企人..." onkeydown="if(event.key==='Enter') addNewMessage()" class="${inputClass}" />
              <button onclick="addNewMessage()" class="px-2.5 py-1 rounded-xl bg-amber-500 text-white fs-xs font-black shrink-0 shadow-sm">發送</button>
            </div>
          </div>
        `;
      } else if (w.id === 'meds') {
        return `
          <div class="flex flex-col h-full min-h-0">
            ${showTitle ? `
              <div class="flex items-center gap-1.5 font-black fs-sm mb-1.5 shrink-0">
                <i class="fa-solid fa-pills text-teal-500"></i>
                <span>${w.title}</span>
              </div>
            ` : ''}
            <div class="flex-1 min-h-0 overflow-y-auto transit-scroll space-y-1.5 pr-0.5">
              ${state.medications.map(med => `
                <div onclick="toggleMedTaken('${med.id}')" class="p-2 rounded-xl bg-black/[0.03] dark:bg-white/[0.05] flex items-center justify-between gap-2 cursor-pointer ${med.taken ? 'opacity-50' : ''}">
                  <div class="min-w-0">
                    <div class="fs-xs font-black truncate ${med.taken ? 'line-through' : ''}">${med.name}</div>
                    <div class="fs-2xs opacity-65 font-bold">${med.time} · ${med.owner}</div>
                  </div>
                  <span class="px-2 py-0.5 rounded-full fs-2xs font-black shrink-0 ${med.taken ? 'bg-emerald-500 text-white' : 'bg-amber-500/20 text-amber-600 dark:text-amber-300'}">
                    ${med.taken ? '已服用' : '待服用'}
                  </span>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      } else if (w.id === 'news') {
        const tickerLine = liveData.news.join('  •  ');
        return `
          <div class="flex flex-col h-full min-h-0">
            ${showTitle ? `
              <div class="flex items-center justify-between gap-1 mb-1.5 shrink-0">
                <div class="flex items-center gap-1.5 font-black fs-sm">
                  <i class="fa-solid fa-newspaper text-sky-500"></i>
                  <span>${w.title}</span>
                </div>
                <span class="px-1.5 py-0.5 rounded bg-rose-600 text-white fs-2xs font-black">LIVE</span>
              </div>
            ` : ''}

            <div class="marquee-wrap py-1 px-2 rounded-xl bg-sky-500/10 text-sky-700 dark:text-sky-300 font-black fs-2xs mb-1.5 shrink-0">
              <div class="marquee-track">
                <span>${tickerLine}</span>
                <span>${tickerLine}</span>
              </div>
            </div>

            <div class="flex-1 min-h-0 overflow-y-auto transit-scroll space-y-1.5 pr-0.5">
              ${liveData.news.map((headline, idx) => `
                <div class="p-1.5 rounded-xl bg-black/[0.03] dark:bg-white/[0.05] flex items-start gap-2">
                  <span class="font-black text-sky-500 fs-2xs mt-0.5">${idx + 1}.</span>
                  <span class="fs-xs font-bold leading-snug">${headline}</span>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      } else if (w.id === 'finance') {
        const showRates = state.showFinanceRates !== false;
        const showGold = state.showFinanceGold !== false;
        const showIndices = state.showFinanceIndices !== false;
        const marqueeExtra = Boolean(state.financeMarqueeExtra);

        const activeTickerCodes = Array.isArray(state.financeTickers)
          ? state.financeTickers.filter(c => FINANCE_CORE_ASSETS[c])
          : ['NVDA', 'AAPL', 'BTC', 'ETH'];

        const selectedCodes = Array.isArray(state.financeCurrencies) && state.financeCurrencies.length > 0
          ? state.financeCurrencies
          : ['CAD', 'JPY'];
        const activeCurrencies = selectedCodes
          .map(c => FINANCE_CURRENCIES[c])
          .filter(Boolean);

        const formatAssetPrice = (code, rawPrice) => {
          const num = Number(rawPrice) || 0;
          if (code === 'BTC') return '$' + Math.round(num).toLocaleString('en-US');
          if (code === 'ETH') return '$' + num.toLocaleString('en-US', { minimumFractionDigits: num >= 1000 ? 0 : 2, maximumFractionDigits: 2 });
          return '$' + num.toFixed(2);
        };

        const marqueeParts = activeTickerCodes.map(code => {
          const meta = FINANCE_CORE_ASSETS[code];
          const quote = liveData.finance.assets?.[code] || { price: meta.defaultPrice, change: meta.defaultChange };
          const chg = Number(quote.change) || 0;
          const sign = chg >= 0 ? '+' : '';
          const chgColor = chg >= 0 ? 'text-emerald-600 dark:text-emerald-300' : 'text-rose-600 dark:text-rose-300';
          return `<span class="inline-flex items-center gap-1">${meta.badge} <b>${meta.code}</b> ${formatAssetPrice(code, quote.price)} <em class="not-italic ${chgColor}">(${sign}${chg.toFixed(2)}%)</em></span>`;
        });

        if (marqueeExtra) {
          if (showGold) {
            marqueeParts.push(`<span class="inline-flex items-center gap-1">🥇 <b>黃金</b> ${liveData.finance.gold}</span>`);
          }
          if (showRates && activeCurrencies.length > 0) {
            activeCurrencies.forEach(cur => {
              const val = liveData.finance.rates?.[cur.code] || cur.defaultRate;
              marqueeParts.push(`<span class="inline-flex items-center gap-1">${cur.flag} <b>${cur.short}</b> ${val}</span>`);
            });
          }
        }

        const marqueeHtml = marqueeParts.join('<span class="mx-3 opacity-40">•</span>');

        const macroCards = [];
        if (showIndices) {
          macroCards.push(`
            <div class="p-1.5 rounded-xl bg-emerald-500/10">
              <div class="fs-2xs opacity-70 font-bold">恆生指數</div>
              <div class="fs-2xs font-black text-emerald-600 dark:text-emerald-300 truncate">${liveData.finance.hsi}</div>

            <div class="p-1.5 rounded-xl bg-sky-500/10">
              <div class="fs-2xs opacity-70 font-bold">標普 500</div>
              <div class="fs-2xs font-black text-sky-600 dark:text-sky-300 truncate">${liveData.finance.sp500}</div>

        if (showGold) {
          macroCards.push(`
            <div class="p-1.5 rounded-xl bg-amber-500/10">

              <div class="fs-2xs font-black text-amber-600 dark:text-amber-300 truncate">${liveData.finance.gold}</div>

        const macroGridCols = macroCards.length === 1 ? 'grid-cols-1' : macroCards.length === 2 ? 'grid-cols-2' : 'grid-cols-3';

        return `
          <div class="flex flex-col h-full min-h-0">
            <div class="flex items-center justify-between gap-1 mb-1.5 shrink-0">

            ${marqueeParts.length > 0 ? `

            <div class="flex-1 min-h-0 overflow-y-auto transit-scroll space-y-1.5 pr-0.5">
              ${activeTickerCodes.length > 0 ? `
                <div class="grid grid-cols-2 gap-1.5">
                  ${activeTickerCodes.map(code => {
                    const meta = FINANCE_CORE_ASSETS[code];
                    const quote = liveData.finance.assets?.[code] || { price: meta.defaultPrice, change: meta.defaultChange };
                    const chg = Number(quote.change) || 0;
                    const sign = chg >= 0 ? '+' : '';
                    const badgeStyle = chg >= 0
                      ? 'bg-emerald-500/15 text-emerald-700 dark:text-emerald-300'
                      : 'bg-rose-500/15 text-rose-700 dark:text-rose-300';
                    return `
                      <div class="p-2 rounded-xl bg-black/[0.04] dark:bg-white/[0.06] flex items-center justify-between gap-1.5">

                          <div class="fs-2xs opacity-75 font-bold truncate">${meta.badge} ${meta.code} · ${meta.label}</div>

                        </div>
                        <span class="px-1.5 py-0.5 rounded-lg fs-2xs font-black tabular-nums shrink-0 ${badgeStyle}">${sign}${chg.toFixed(2)}%</span>
                      </div>
                    `;
                  }).join('')}
                </div>
              ` : ''}

              ${showRates && activeCurrencies.length > 0 ? `
                <div class="grid grid-cols-2 gap-1.5">
                  ${activeCurrencies.map(cur => {
                    const val = liveData.finance.rates?.[cur.code] || cur.defaultRate;
                    return `
                      <div class="p-2 rounded-xl bg-amber-500/[0.08] border border-amber-500/15 flex items-center justify-between gap-1">
                        <div class="min-w-0">
                          <div class="fs-2xs opacity-75 font-bold truncate">${cur.flag} ${cur.short}</div>
                          <div class="fs-sm font-black tabular-nums">${val}</div>

                      </div>
                    `;
                  }).join('')}
                </div>
              ` : ''}

              ${macroCards.length > 0 ? `
                <div class="grid ${macroGridCols} gap-1.5 pt-0.5">
                  ${macroCards.join('')}
                </div>
              ` : ''}
            </div>
          </div>

      } else if (w.id === 'aqhi') {
        return `
          <div class="flex flex-col justify-between h-full min-h-0">
            ${showTitle ? `
              <div class="flex items-center gap-1.5 font-black fs-sm">

                <div class="fs-xl font-black text-emerald-500 leading-none">3 · 低</div>

              </div>

                <i class="fa-solid fa-leaf"></i>

      } else if (w.id === 'quickLinks') {
        const links = [
          { label: '家庭 Google Sheet', icon: 'fa-table', color: 'text-emerald-500', url: state.googleSheetUrl || DEFAULT_SHARED_SHEET_URL },
          { label: '香港天文台', icon: 'fa-cloud-sun', color: 'text-amber-500', url: 'https://www.hko.gov.hk/tc/' },
          { label: '港鐵行程指南', icon: 'fa-train', color: 'text-rose-500', url: 'https://www.mtr.com.hk/ch/customer/jp/' },
          { label: '機場航班資訊', icon: 'fa-plane-departure', color: 'text-sky-500', url: 'https://www.hongkongairport.com/tc/flights/departures/passenger.page' }

        return `

            </div>
          </div>

      } else if (w.id === 'flight') {
        const flights = Array.isArray(state.flights) ? state.flights : [];
        return `
          <div class="flex flex-col h-full min-h-0">
            <div class="flex items-center justify-between gap-1 mb-1.5 shrink-0">
              ${showTitle ? `
                <div class="flex items-center gap-1.5 font-black fs-sm">
                  <i class="fa-solid fa-plane-up text-sky-500"></i>
                  <span>${w.title}</span>
                </div>
              ` : ''}

            <div class="flex-1 min-h-0 overflow-y-auto transit-scroll space-y-2 pr-0.5">
              ${flights.length > 0 ? flights.map(rawFl => {
                const fl = normalizeFlightItem(rawFl);
                const pct = Math.max(4, Math.min(96, Number(fl.progress) || 50));
                const remText = formatRemainingFlightTime(fl.durationMins, fl.progress);

                return `
                  <div onclick="openWidgetSettings('flight')" class="p-2.5 rounded-2xl bg-gradient-to-br from-sky-500/10 to-indigo-500/10 border border-sky-500/20 space-y-2 cursor-pointer">
                    <div class="flex items-center justify-between gap-2">
                      <div class="flex items-center gap-1.5">
                        <span class="px-2 py-0.5 rounded-lg bg-sky-600 text-white font-black fs-xs tracking-wide">${fl.flightNumber}</span>
                        <span class="fs-xs font-extrabold opacity-85">${fl.airline}</span>
                      </div>
                      <span class="px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-600 dark:text-emerald-300 fs-2xs font-black">${remText}</span>
                    </div>

                    <div class="flex items-center justify-between gap-2">
                      <div>
                        <div class="fs-lg font-black leading-none">${fl.fromCode}</div>
                        <div class="fs-2xs opacity-70 font-bold mt-0.5">${fl.fromCity}</div>
                      </div>

                      <div class="flex-1 px-2">
                        <div class="relative h-2.5 rounded-full bg-black/10 dark:bg-white/15 flex items-center">
                          <div class="h-full rounded-full bg-gradient-to-r from-sky-400 to-indigo-500 transition-all duration-700" style="width:${fl.progress}%"></div>
                          <div class="absolute -top-3.5 -translate-x-1/2 flex items-center whitespace-nowrap text-base drop-shadow transition-all duration-700" style="left:${pct}%">
                            <span>${fl.emoji}🚀</span>
                          </div>
                        </div>
                      </div>

                      <div class="text-right">
                        <div class="fs-lg font-black leading-none">${fl.toCode}</div>

                    </div>

                    <div class="grid grid-cols-4 gap-1 pt-1 border-t border-black/5 dark:border-white/10 text-center">

                      </div>
                      <div class="p-1 rounded-lg bg-black/[0.04] dark:bg-white/[0.06]">
                        <div class="fs-2xs opacity-60 font-bold">執飛機型</div>
                        <div class="fs-2xs font-black truncate">${fl.aircraft}</div>
                      </div>
                    </div>
                  </div>
                `;
              }).join('') : `<div class="h-full flex items-center justify-center opacity-50 fs-xs font-bold">點擊右上角「+ 設定航班」輸入航班號碼</div>`}
            </div>
          </div>
        `;
      }

      return '';
    }

    /* Widget Settings Modal */
    function openWidgetSettings(widgetId) {
      const w = state.widgets.find(x => x.id === widgetId);
      if (!w) return;
      const modal = document.getElementById('settingsModal');
      const titleEl = document.getElementById('settingsModalTitle');
      const bodyEl = document.getElementById('settingsModalBody');
      if (!modal || !titleEl || !bodyEl) return;

      titleEl.textContent = `${w.title} · 卡片設定`;

      let customSection = '';
      if (w.id === 'flight') {
        const emojiBtns = FLIGHT_PERSON_EMOJIS.map(em => `
          <button type="button" onclick="selectFlightEmoji('${em}')" class="flight-emoji-btn w-9 h-9 rounded-xl text-lg flex items-center justify-center border ${selectedFlightEmoji === em ? 'border-indigo-500 bg-indigo-500/15 scale-105' : 'border-black/10 dark:border-white/10'}">
            ${em}
          </button>
        `).join('');

        customSection = `
          <div class="p-3 rounded-2xl bg-sky-500/10 border border-sky-500/20 space-y-2.5">

              <div class="text-[11px] font-bold opacity-75 mb-1">選擇相關人物 Emoji：</div>

            ${(state.flights || []).map(fl => `
              <div class="p-2.5 rounded-2xl bg-black/5 dark:bg-zinc-800 space-y-2">

                  <span class="font-black">${fl.emoji} ${fl.flightNumber}（${fl.fromCode} → ${fl.toCode}）</span>

                  </div>
                  <div>
                    <label class="text-[10px] opacity-65">登機閘口 Gate</label>
                    <input type="text" value="${fl.gate}" onchange="updateFlightField('${fl.id}', 'gate', this.value)" class="w-full px-2 py-1 rounded-lg bg-white dark:bg-zinc-900 font-bold text-xs" />

              </div>
            `).join('')}
          </div>
        `;
      } else if (w.id === 'transit') {
        const lineOpts = Object.entries(MTR_LINES).map(([code, info]) =>
          `<option value="${code}">${info.name}</option>`
